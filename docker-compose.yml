services:
  finanzmanager:
    build: .
    image: finanzmanager:latest
    container_name: finanzmanager
    restart: unless-stopped
    ports:
      - "8090:8080"
    volumes:
      - /mnt/user/appdata/finanzmanager:/data
    environment:
      - APP_PASSWORD=bitte-aendern
      - FINTS_PRODUCT_ID=
      - TZ=Europe/Berlin
