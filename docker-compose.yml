services:
  kontor:
    build: .
    image: kontor:latest
    container_name: kontor
    restart: unless-stopped
    ports:
      - "8090:8080"
    volumes:
      - /mnt/user/appdata/kontor:/data
      - /mnt/user/finanzen/eingang:/eingang
    environment:
      - APP_PASSWORD=bitte-aendern
      - FINTS_PRODUCT_ID=
      - TZ=Europe/Berlin
