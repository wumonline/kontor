  return '<span class="muted">–</span>';
}
/* ---------- Depot: Positionen je Wertpapier mit aktuellem Kurs ----------
   Bestand und Einstand nach Durchschnittskosten aus den Depotbuchungen mit Wertpapierangabe (t.sec).
   Saveback hat keine Stückzahl: der Betrag zählt zum Einstand, die Stückzahl kann von Hand korrigiert werden.
   Kurse holt der Server (onvista, nur die ISIN wird übertragen) und legt sie in DB.securities ab. */
const isDepot = a => !!a && (a.type === 'Port' || a.type === 'Invst');
const fmtShares = n => (n || 0).toLocaleString('de-DE', { maximumFractionDigits: 6 });
const fmtPrice = (p, cur = 'EUR') => { try { return new Intl.NumberFormat('de-DE', { style: 'currency', currency: cur || 'EUR', minimumFractionDigits: 2, maximumFractionDigits: 4 }).format(p); } catch (e) { return p + ' ' + cur; } };
function depotPositions(acct) {
  const pos = {};
  for (const t of DB.tx.filter(t => t.acct === acct && t.sec && t.sec.isin).sort((a, b) => a.date.localeCompare(b.date) || a.id - b.id)) {
    const s = t.sec, p = pos[s.isin] || (pos[s.isin] = { isin: s.isin, name: s.name || s.isin, shares: 0, cost: 0, realized: 0, unknown: 0, n: 0, first: t.date, last: t.date });
    p.last = t.date; p.n++; if (s.name) p.name = s.name;
    if (s.shares == null) { p.cost += t.amount; p.unknown += t.amount; continue; }
    if (s.shares > 0) { p.shares += s.shares; p.cost += t.amount; continue; }
    const sold = -s.shares, part = p.shares > 0 ? Math.min(1, sold / p.shares) : 1, costOut = Math.round(p.cost * part);
    p.realized += -t.amount - costOut; p.shares = Math.max(0, p.shares - sold); p.cost -= costOut;
    if (p.shares < 1e-6) { p.shares = 0; p.cost = 0; p.unknown = 0; }
  }
  return Object.values(pos).map(p => {
    const sec = (DB.securities || {})[p.isin] || {}, fix = sec.fix && sec.fix[acct], q = sec.quote;
    p.fix = fix != null ? fix : null;
    p.held = p.fix != null ? p.fix : p.shares;
    p.open = p.held > 1e-9 || p.cost > 0;
    p.quote = q && q.price != null ? q : null;
    if (p.quote && p.quote.currency === 'EUR') {
      p.value = Math.round(p.held * p.quote.price * 100);
      if (p.fix == null && p.unknown) p.value += p.unknown;     // Saveback ohne Stückzahl: zum Einstand
      p.gain = p.value - p.cost;
    } else { p.value = null; p.gain = null; }
    return p;
  }).sort((a, b) => (b.value ?? b.cost) - (a.value ?? a.cost));
}
function depotValue(acct) {
  const ps = depotPositions(acct).filter(p => p.open);
  if (!ps.length) return null;
  const known = ps.every(p => p.value != null);
  return { value: ps.reduce((s, p) => s + (p.value ?? p.cost), 0), cost: ps.reduce((s, p) => s + p.cost, 0), known, n: ps.length };
}
const quoteAge = () => { const ts = Object.values(DB.securities || {}).map(s => s.fetched || '').sort(); return ts.length ? ts[ts.length - 1] : ''; };
async function refreshQuotes(silent) {
  if (!Server.ok) { if (!silent) toast('Kurse holt der Kontor-Server. Öffne die App über den Server.'); return; }
  const isins = [...new Set(Object.values(DB.accounts).filter(isDepot).flatMap(a => depotPositions(a.name).filter(p => p.open).map(p => p.isin)).concat(pensionIsins()))];
  if (!isins.length) return;
  UI.quoting = true; render();
  try {
    const r = await fetch('api/quotes', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ isins }) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const { quotes } = await r.json(), now = new Date().toISOString(), bad = [];
    DB.securities = DB.securities || {};
    for (const [isin, q] of Object.entries(quotes)) {
      const s = DB.securities[isin] || (DB.securities[isin] = {});
      if (q.error) { bad.push(isin); continue; }
      s.quote = { price: q.price, currency: q.currency, time: q.time, market: q.market, changePct: q.changePct }; s.fetched = now;
      if (!s.name) s.name = q.name;
    }
    save();
    if (!silent || bad.length) toast(bad.length ? `Kurse aktualisiert, für ${bad.length} ${bad.length === 1 ? 'Wertpapier' : 'Wertpapiere'} gab es keinen Kurs (${bad.join(', ')}).` : `${isins.length} Kurse aktualisiert.`, null, bad.length ? 9000 : 4000);
  } catch (e) { toast('Kurse konnten nicht geladen werden: ' + e.message); }
  finally { UI.quoting = false; render(); }
}
Views.depot = () => {
  const depots = Object.values(DB.accounts).filter(a => isDepot(a) && (!a.inactive || depotPositions(a.name).some(p => p.open))).sort((a, b) => a.name.localeCompare(b.name, 'de'));
  const age = quoteAge();
  if (Server.ok && !UI.quoting && depots.length && (!age || Date.now() - Date.parse(age) > 15 * 60e3) && !UI.quoteTried) { UI.quoteTried = true; setTimeout(() => refreshQuotes(true), 0); }
  const head = `<div class="row spread"><h1>Depot</h1><div class="row">
      <span class="muted">${age ? `Kurse von ${new Date(age).toLocaleString('de-DE', { dateStyle: 'short', timeStyle: 'short' })}` : 'Noch keine Kurse'}</span>
      <button id="quotes-refresh" ${Server.ok && !UI.quoting ? '' : 'disabled'} title="${Server.ok ? 'Holt die aktuellen Kurse über deinen Server' : 'Nur mit dem Kontor-Server'}">${UI.quoting ? '<span class="spin" aria-hidden="true"></span> Lade Kurse …' : 'Kurse aktualisieren'}</button></div></div>`;
  if (!depots.length) return head + '<div class="panel empty"><p class="muted">Noch kein Depot. Ein Konto mit der Art „Depot“ entsteht zum Beispiel beim Import einer Trade-Republic-Datei.</p></div>';
  const pct = (a, b) => b ? (a / b * 100).toLocaleString('de-DE', { maximumFractionDigits: 1, minimumFractionDigits: 1 }) + ' %' : '';
  return head + (Server.ok ? '' : '<div class="notice">Aktuelle Kurse gibt es nur, wenn die App über deinen Kontor-Server geöffnet ist. Hier siehst du Bestand und Einstand.</div>')
    + depots.map(a => {
      const all = depotPositions(a.name), open = all.filter(p => p.open), closed = all.filter(p => !p.open);
      const tot = { cost: open.reduce((s, p) => s + p.cost, 0), value: open.reduce((s, p) => s + (p.value ?? p.cost), 0), known: open.every(p => p.value != null) };
      const realized = all.reduce((s, p) => s + p.realized, 0);
      const row = p => {
        const q = p.quote, avg = p.fix != null ? (p.held > 0 ? p.cost / 100 / p.held : null) : (p.shares > 0 ? (p.cost - p.unknown) / 100 / p.shares : null);
        return `<tr><td><b>${esc(p.name)}</b><span class="sub num">${esc(p.isin)}</span></td>
          <td class="r"><input type="text" class="num shares" inputmode="decimal" data-secfix="${esc(p.isin)}" data-acct="${esc(a.name)}" value="${fmtShares(p.held)}" aria-label="Stück ${esc(p.name)}" title="Stückzahl laut Depot. Leer lassen = aus den Buchungen berechnet.">
            ${p.fix != null ? `<span class="sub">korrigiert, berechnet ${fmtShares(p.shares)}</span>` : p.unknown ? `<span class="sub warn-t" title="Saveback ohne Stückzahl in der Datei">+ Saveback ${money(p.unknown)}</span>` : ''}</td>
          <td class="r num">${money(p.cost)}${avg ? `<span class="sub">Ø ${fmtPrice(avg)}</span>` : ''}</td>
          <td class="r num">${q ? `${fmtPrice(q.price, q.currency)}<span class="sub ${q.changePct > 0 ? 'pos' : q.changePct < 0 ? 'neg' : ''}" title="${esc(q.market)}, ${q.time ? new Date(q.time).toLocaleString('de-DE', { dateStyle: 'short', timeStyle: 'short' }) : ''}">${q.changePct != null ? (q.changePct > 0 ? '+' : '') + q.changePct.toLocaleString('de-DE', { maximumFractionDigits: 2 }) + ' % heute' : esc(q.market)}</span>` : '<span class="muted">–</span>'}</td>
          <td class="r num">${p.value != null ? money(p.value) : '<span class="muted">–</span>'}</td>
          <td class="r num ${moneyCls(p.gain)}">${p.gain != null ? `${money(p.gain)}<span class="sub">${pct(p.gain, p.cost)}</span>` : ''}</td>
          <td class="r"><button class="icon" data-secbook="${esc(p.isin)}" data-acct="${esc(a.name)}" title="Buchungen zu diesem Wertpapier" aria-label="Buchungen ${esc(p.name)}">☰</button></td></tr>`;
      };
      return `<div class="panel"><div class="row spread"><h2>${logo(DB.institutes[a.institute], 28)} ${esc(a.name)}</h2>
          <div class="kpis mini"><div><span class="label">Kurswert</span><b class="num">${tot.known ? '' : '≈ '}${money(tot.value)}</b></div>
          <div><span class="label">Einstand</span><b class="num">${money(tot.cost)}</b></div>
          <div><span class="label">Gewinn/Verlust</span><b class="num ${moneyCls(tot.value - tot.cost)}">${money(tot.value - tot.cost)} <small>${pct(tot.value - tot.cost, tot.cost)}</small></b></div></div></div>
        ${open.length ? `<div class="table-wrap"><table class="depot"><thead><tr><th>Wertpapier</th><th class="r">Stück</th><th class="r">Einstand</th><th class="r">Kurs</th><th class="r">Wert</th><th class="r">Gewinn/Verlust</th><th></th></tr></thead>
          <tbody>${open.map(row).join('')}</tbody></table></div>` : '<p class="muted">Keine offenen Positionen.</p>'}
        ${closed.length ? `<details class="sub-panel"><summary>Verkaufte Positionen (${closed.length}), realisiert ${money(realized)}</summary>
          <div class="table-wrap"><table><tbody>${closed.map(p => `<tr><td><b>${esc(p.name)}</b><span class="sub num">${esc(p.isin)}</span></td><td class="muted">${dDE(p.first)} – ${dDE(p.last)}</td><td class="r num ${moneyCls(p.realized)}">${money(p.realized)}</td>
            <td class="r"><button class="icon" data-secbook="${esc(p.isin)}" data-acct="${esc(a.name)}" title="Buchungen zu diesem Wertpapier" aria-label="Buchungen ${esc(p.name)}">☰</button></td></tr>`).join('')}</tbody></table></div></details>` : ''}
        ${open.some(p => p.unknown && p.fix == null) ? '<p class="muted">Bei Saveback steht in der Datei keine Stückzahl. Trag bei diesen Positionen die Stückzahl aus der Trade-Republic-App ein, dann stimmt der Wert genau.</p>' : ''}
      </div>`;
    }).join('')
    + '<p class="muted">Einstand nach Durchschnittskosten, ohne Gebühren. Kurse über onvista, bevorzugt vom Handelsplatz LS Exchange. Dafür wird nur die ISIN übertragen.</p>';
};

    if (!t.category) { x.open++; openTotal++; }

    const s = slug(c), info = DB.categories[c] || { income: (u[c] && u[c].sum > 0) }, n = u[c] ? u[c].n : 0;

Views.import = () => {
  const p = UI.pending;
  let preview = '';
  if (p) {
    const r = p.parsed;
    const per = {};
    for (const t of r.tx) { const a = per[t.acct] = per[t.acct] || { n: 0, dup: 0, min: t.date, max: t.date, sum: 0, splits: 0 }; a.n++; if (t.dup) a.dup++; a.min = t.date < a.min ? t.date : a.min; a.max = t.date > a.max ? t.date : a.max; a.sum += t.amount; if (t.splits.length) a.splits++; }
    const newCount = r.tx.filter(t => !t.dup).length;
    const skipped = Object.entries(r.skipped).filter(([k]) => !/^(Memorized)$/i.test(k));
    preview = `<div class="panel">
      <div class="row spread"><h2>Vorschau: ${esc(p.file)}</h2><span class="chip ${r.problems.length ? 'warn' : 'ok'}">${r.problems.length ? r.problems.length + ' Probleme' : 'Keine Fehler'}</span></div>
      <p class="muted">${r.accounts.length} Konten, ${r.categories.length} Kategorien, ${r.classes.length} Klassen, ${r.tx.length} Buchungen. Datumsformat ${r.order === 'MDY' ? 'Monat.Tag.Jahr' : 'Tag.Monat.Jahr'}${r.guessed ? ' (erkannt)' : ' (laut Datei)'}.</p>
      <div class="table-wrap"><table><thead><tr><th>Konto</th><th>Typ</th><th class="r">Buchungen</th><th class="r">Neu</th><th>Zeitraum</th><th class="r">Summe</th></tr></thead><tbody>
      ${r.accounts.map(a => { const x = per[a.name]; return `<tr><td>${esc(a.name)}${DB.accounts[a.name] ? ' <span class="chip">vorhanden</span>' : ''}</td><td>${esc(acctType(a.type))}</td><td class="r num">${x ? x.n : 0}${x && x.splits ? `<span class="sub">${x.splits} Splits</span>` : ''}</td><td class="r num">${x ? x.n - x.dup : 0}</td><td class="num">${x ? dDE(x.min) + ' – ' + dDE(x.max) : '–'}</td><td class="r num ${x ? moneyCls(x.sum) : ''}">${x ? money(x.sum) : '–'}</td></tr>`; }).join('')}
      </tbody></table></div>
      ${r.problems.length ? `<details><summary>Probleme anzeigen</summary><ul>${r.problems.slice(0, 50).map(x => `<li>${esc(x)}</li>`).join('')}</ul></details>` : ''}
      ${skipped.length ? `<p class="notice">Nicht übernommen: ${skipped.map(([k, v]) => `${v} × ${esc(k)}`).join(', ')}. Wertpapierbuchungen kommen in einer späteren Version.</p>` : ''}
      ${newCount < r.tx.length ? `<p class="muted">${r.tx.length - newCount} Buchungen sind schon vorhanden und werden übersprungen.</p>` : ''}
      ${(() => {
        const tr = r.tx.filter(t => !t.dup && t.transfer && t.transfer !== t.acct);
        const missing = tr.filter(t => !r.tx.some(o => o.acct === t.transfer && o.transfer === t.acct && o.amount === -t.amount && o.date === t.date)).length
          + r.tx.filter(t => !t.dup).reduce((s, t) => s + t.splits.filter(x => x.transfer && x.transfer !== t.acct).length, 0);
        return missing ? `<p class="muted">${missing} Umbuchungen stehen nur in einem Konto. Quicken exportiert sie so. Die fehlenden Gegenbuchungen werden beim Import ergänzt.</p>` : '';
      })()}

        <b>Datei hierher ziehen: QIF aus Quicken, CSV von der Bank, PDF-Kontoauszüge oder Belege</b>

/* Kontostand laut Bank: Startbetrag rückwärts rechnen. Anfangssaldo = Stand am Datum − Summe aller Buchungen bis dahin. */
function setBankBalance(name, amount, date) {
  const a = DB.accounts[name]; if (!a || a.locked) return;
  a.bank = { amount, date };
  const before = a.opening || 0;
  a.opening = 0; a.opening = amount - balance(name, date);
  save(); render();
  toast(`Startbetrag für „${name}“ rückwärts berechnet: ${money(a.opening)}${before !== a.opening ? ` (vorher ${money(before)})` : ''}. Stand am ${dDE(date)}: ${money(amount)}.`, null, 8000);
}
function bankCheck(a) {
  if (!a.bank) return '<span class="sub">Stand eingeben, der Startbetrag wird berechnet</span>';
  const app = balance(a.name, a.bank.date), d = a.bank.amount - app;
  if (!d) return `<span class="sub"><span class="chip ok">stimmt am ${dDE(a.bank.date)}</span></span>`;
  return `<span class="sub"><span class="chip warn" title="App am ${dDE(a.bank.date)}: ${money(app)}">Abweichung ${money(d)}</span>${a.locked ? '' : ` <button class="mini" data-bankfix="${esc(a.name)}">Startbetrag anpassen</button>`}</span>`;
}

/* ---------- Import-Logik ---------- */
async function readFile(file) {
  const buf = new Uint8Array(await file.arrayBuffer());
  const isQdf = /\.(qdf|qsd)$/i.test(file.name) || (buf[0] === 0xAC && buf[1] === 0x9E && buf[2] === 0xBD && buf[3] === 0x8F);
  if (isQdf) { toast('QDF/QSD-Dateien sind von Quicken verschlüsselt und lassen sich nicht direkt lesen. Bitte in Quicken als QIF exportieren.', null, 9000); return; }

  const head = QIF.decode(buf.slice(0, 2000));
  if (/\.csv$/i.test(file.name) || (!/^\s*!/.test(head) && /[;,\t]/.test(head))) return readCSVFile(file, buf);

function queueStatements(files) {

}
function readFiles(list) {
  const files = Array.from(list || []);

function importText(text, fileName) {

    const base = [t.acct, t.date, t.amount, t.payee, t.memo, t.number].join('|');
    occ[base] = (occ[base] || 0) + 1;
    t.key = base + '#' + occ[base];

  for (const t of parsed.tx) if (!parsed.accounts.some(a => a.name === t.acct)) parsed.accounts.push({ name: t.acct, type: '', desc: '' });

}
function commitImport() {
  const p = UI.pending; if (!p) return;
  const r = p.parsed, impId = 'i' + Date.now();

  for (const c of r.categories) if (!DB.categories[c.name]) DB.categories[c.name] = { name: c.name, income: c.income, desc: c.desc };
  DB.classes = [...new Set([...DB.classes, ...r.classes])];
  let n = 0; const added = [];

    const nt = { id: ++DB.seq, imp: impId, key: t.key, acct: t.acct, date: t.date, amount: t.amount, payee: t.payee, memo: t.memo, number: t.number, cleared: t.cleared, category: t.category, cls: t.cls, transfer: t.transfer, splits: t.splits.map(s => ({ category: s.category, cls: s.cls, transfer: s.transfer, memo: s.memo, amount: s.amount })) };
    DB.tx.push(nt); added.push(nt);

  const ruled = applyRules(added).length;

  DB.tx.sort((a, b) => a.date.localeCompare(b.date) || a.id - b.id);

}

function setLogo(instId, file) {

  const url = URL.createObjectURL(file), img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas'); c.width = c.height = 96;
    const ctx = c.getContext('2d'), s = Math.min(96 / img.width, 96 / img.height) || 1;
    const w = img.width * s, h = img.height * s;
    ctx.drawImage(img, (96 - w) / 2, (96 - h) / 2, w, h);
    DB.institutes[instId].logo = c.toDataURL('image/png');
    URL.revokeObjectURL(url); save(); render();
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('Das Bild konnte nicht gelesen werden.'); };
  img.src = url;
}

function setCategory(id, cat) {
  const tx = DB.tx.find(x => x.id === id); if (!tx) return;
  tx.category = cat; delete tx.byRule; save();
  const p = displayPayee(tx);
  const same = cat && p ? DB.tx.filter(x => x !== tx && isUncategorized(x) && displayPayee(x) === p) : [];
  const hasRule = DB.rules.some(r => r.active && ruleMatches(r, tx));
  const asRule = { label: 'Als Regel speichern', run: () => openRule(null, { field: 'any', op: 'equals', value: tx.payeeOrig || p, category: cat }) };
  if (same.length) {
    toast(`Auch für ${same.length} weitere Buchungen von „${p}“ übernehmen?`, [{ label: 'Übernehmen', run: () => { same.forEach(x => { x.category = cat; delete x.byRule; }); save(); render(); } }].concat(hasRule ? [] : [asRule]), 10000);
  } else if (cat && p && !hasRule) {
    toast(`Kategorie gesetzt. Künftig „${p}“ automatisch zuordnen?`, asRule, 8000);
  }
  const input = $('#cat-' + id); if (input) input.classList.toggle('empty', !cat);
  $('#catlist').innerHTML = allCategories().map(c => `<option value="${esc(c)}">`).join('');
}

/* Automatische Sicherungen des Servers (Ordner backups neben kontor.json) */
function serverBackupInfo() {
  if (!Server.ok) return '';
  const b = Server.backups, v = Server.info && Server.info.version;
  const when = name => { const m = /(\d{4})(\d\d)(\d\d)(?:-(\d\d))?/.exec(name || ''); return m ? `${m[3]}.${m[2]}.${m[1]}${m[4] ? ` ${m[4]} Uhr` : ''}` : '–'; };
  const parts = b ? [
    `${b.hourly.count} stündliche (letzte ${when(b.hourly.last)})`,
    `${b.daily.count} tägliche (letzte ${when(b.daily.last)})`,
    `${b.update.count} vor Updates${b.update.last ? ` (zuletzt vor ${esc(b.update.last.replace(/^kontor-vor-|-\d{8}-\d{6}\.json$/g, ''))})` : ''}`] : [];
  return `<p class="muted">Kontor ${esc(v || '?')} läuft auf deinem Server. Er sichert die Daten selbst${b ? `: ${parts.join(', ')}` : ''}. Sie liegen im Datenordner unter „backups“.</p>`;
}
function downloadBackup() {
  const blob = new Blob([JSON.stringify(DB)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `kontor-backup-${TODAY}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
async function restoreBackup(file) {
  try {
    let d = JSON.parse(await file.text());
    if (d && 'rev' in d && d.data) d = d.data;   // Sicherung des Servers (kontor.json mit rev/saved/data)
    if (!d || d.version !== 1 || !Array.isArray(d.tx) || typeof d.accounts !== 'object') throw new Error('Unbekanntes Format');
    DB = ensureModel(d); save(); UI.year = null; toast(`Backup mit ${d.tx.length} Buchungen wiederhergestellt.`); location.hash = 'uebersicht'; render();
  } catch (err) { toast('Backup konnte nicht gelesen werden: ' + err.message); }
}

/* Drag & Drop auf der ganzen Seite */
['dragover', 'dragenter'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); const d = $('#drop'); if (d) d.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); const d = $('#drop'); if (d) d.classList.remove('over'); }));
document.addEventListener('drop', e => { if (e.dataTransfer) readFiles(e.dataTransfer.files); });

window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
window.FM = { importText, QIF, buildExport, csvText }; // für Tests
render();
Server.boot();
</script>
</body>
