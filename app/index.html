<style>
/* Layout: feste Navigationsleiste links (auf dem Handy oben), rechts die jeweilige Ansicht.

:root {

  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c6: #008300; --c7: #6250d6; --c-other: #b3bec4; --c-none-bg: #eef1f3;
  --font: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --mono: "Cascadia Mono", Consolas, ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1518; --surface: #162126; --fg: #e3eaed; --muted: #93a3ab; --line: #26353c;
    --accent: #3cc2ad; --pos: #3cc2ad; --accent-soft: #15302c; --minus: #e2766e; --warn: #e0a84a; --warn-soft: #33281a; --tout: #f0a35a; --tout-soft: #3a2914; --tin: #84b6ec; --tin-soft: #172a3e;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #0ca30c; --c7: #9085e9; --c-other: #4f5f67; --c-none-bg: #1d2a30;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1518; --surface: #162126; --fg: #e3eaed; --muted: #93a3ab; --line: #26353c;
  --accent: #3cc2ad; --pos: #3cc2ad; --accent-soft: #15302c; --minus: #e2766e; --warn: #e0a84a; --warn-soft: #33281a; --tout: #f0a35a; --tout-soft: #3a2914; --tin: #84b6ec; --tin-soft: #172a3e;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #0ca30c; --c7: #9085e9; --c-other: #4f5f67; --c-none-bg: #1d2a30;
  color-scheme: dark;
}

<script>
'use strict';
/* ---------- Hilfsfunktionen ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const EUR = new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' });
const money = c => EUR.format((c || 0) / 100);
const moneyCls = c => c < 0 ? 'neg' : c > 0 ? 'pos' : '';
const dDE = d => d ? d.slice(8, 10) + '.' + d.slice(5, 7) + '.' + d.slice(0, 4) : '';
const TODAY = new Date().toISOString().slice(0, 10);
const MONTHS = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];
const ACCT_TYPES = { 'Bank': 'Girokonto', 'CCard': 'Kreditkarte', 'Cash': 'Bargeld', 'Oth T': 'Tagesgeld', 'Save': 'Sparkonto', 'Pens': 'Rentenkonto', 'Oth A': 'Vermögen', 'Oth L': 'Verbindlichkeit', 'Oth D': 'Sonstiges', 'Port': 'Depot', 'Invst': 'Depot' };
/* Gruppen nach Kontoart, in dieser Reihenfolge angezeigt */
const TYPE_GROUPS = { 'Bank': 'Girokonten', 'Oth T': 'Tagesgeld', 'Save': 'Sparkonten', 'CCard': 'Kreditkarten', 'Cash': 'Bargeld', 'Port': 'Depots', 'Pens': 'Rentenkonten', 'Oth A': 'Vermögen', 'Oth L': 'Verbindlichkeiten', 'Oth D': 'Sonstiges' };
const typeGroup = t => t === 'Invst' ? 'Port' : TYPE_GROUPS[t] ? t : 'Oth D';
const acctType = t => ACCT_TYPES[t] || t || '–';

/* ---------- Datumsfelder ----------
   Statt des Datumsfelds des Browsers ein Textfeld TT.MM.JJJJ mit Kalenderknopf. Eintippen geht frei:
   „1.8.29“, „01.08.2029“, „01082029“, „1.8.“ (laufendes Jahr) oder JJJJ-MM-TT.
   Nach außen liefert .value weiter JJJJ-MM-TT, damit der übrige Code unverändert bleibt. */
const NATIVE_VALUE = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value');
function parseDateDE(s) {
  s = String(s || '').trim(); if (!s) return '';
  let d, m, y, x;
  if ((x = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) [, y, m, d] = x;
  else if ((x = s.match(/^(\d{1,2})[.\/-](\d{1,2})(?:[.\/-](\d{2}|\d{4})?)?$/))) [, d, m, y] = x;
  else if ((x = s.match(/^(\d{2})(\d{2})(\d{2}|\d{4})?$/))) [, d, m, y] = x;
  else return null;
  const cy = +TODAY.slice(0, 4);
  y = y ? +y : cy; if (y < 100) y += y > cy % 100 + 30 ? 1900 : 2000;
  d = +d; m = +m;
  const dt = new Date(Date.UTC(y, m - 1, d));
  if (y < 1900 || y > 2200 || dt.getUTCMonth() !== m - 1 || dt.getUTCDate() !== d) return null;
  return dt.toISOString().slice(0, 10);
}
const isoToDE = v => /^\d{4}-\d{2}-\d{2}$/.test(v || '') ? `${v.slice(8, 10)}.${v.slice(5, 7)}.${v.slice(0, 4)}` : (v || '');
function enhanceDates(root) {
  if (!root) return;
  for (const el of root.querySelectorAll('input[type="date"]')) {
    const iso = NATIVE_VALUE.get.call(el);
    el.type = 'text'; el.classList.add('date'); el.inputMode = 'numeric'; el.placeholder = 'TT.MM.JJJJ'; el.autocomplete = 'off'; el.maxLength = 10;
    Object.defineProperty(el, 'value', {
      configurable: true,
      get() { const raw = NATIVE_VALUE.get.call(this).trim(); if (!raw) return ''; return parseDateDE(raw) || raw; },
      set(v) { NATIVE_VALUE.set.call(this, isoToDE(v)); this.removeAttribute('aria-invalid'); }
    });
    el.value = iso;
    const w = document.createElement('span'); w.className = 'date-wrap';
    const b = document.createElement('button'); b.type = 'button'; b.className = 'icon cal'; b.textContent = '📅';
    b.setAttribute('aria-label', 'Kalender öffnen'); b.title = 'Kalender';
    el.replaceWith(w); w.append(el, b);
  }
}
/* Beim Verlassen des Felds: Schreibweise vereinheitlichen oder als ungültig markieren (vor allen anderen Handlern) */
document.addEventListener('change', e => {
  const el = e.target; if (!el.classList || !el.classList.contains('date')) return;
  const raw = NATIVE_VALUE.get.call(el).trim(), iso = parseDateDE(raw);
  if (iso) { NATIVE_VALUE.set.call(el, isoToDE(iso)); el.removeAttribute('aria-invalid'); }
  else if (raw) { el.setAttribute('aria-invalid', 'true'); toast(`„${raw}“ ist kein gültiges Datum. Beispiele: 1.8.2029, 1.8.29, 01082029.`); }
}, true);
function openCalendar(btn) {
  const el = btn.previousElementSibling; if (!el) return;
  const r = btn.getBoundingClientRect(), p = document.createElement('input');
  p.type = 'date'; p.tabIndex = -1;
  p.style.cssText = `position:fixed;left:${r.left}px;top:${r.bottom}px;width:1px;height:1px;opacity:0;border:0;padding:0;pointer-events:none`;
  const iso = el.value; if (/^\d{4}-\d{2}-\d{2}$/.test(iso)) p.value = iso;
  (el.closest('dialog') || document.body).appendChild(p);
  p.addEventListener('change', () => { if (p.value) { el.value = p.value; el.dispatchEvent(new Event('change', { bubbles: true })); } p.remove(); });
  p.addEventListener('blur', () => setTimeout(() => p.remove(), 500));
  try { p.showPicker(); } catch (e) { p.remove(); el.focus(); }
}

/* ---------- Darstellung ----------
   Schriftgröße, Hell/Dunkel und Farbschema gelten pro Gerät und liegen im Browser, nicht in den Daten:
   Handy und PC dürfen verschieden aussehen. Das Farbschema ändert die Akzentfarbe; Einnahmen bleiben grün. */
const PALETTES = {
  petrol: { name: 'Petrol', l: ['#0f7a6c', '#e0f1ee'], d: ['#3cc2ad', '#15302c'] },
  blau: { name: 'Blau', l: ['#1f62a8', '#e4eefa'], d: ['#6aa6ec', '#172a3e'] },
  violett: { name: 'Violett', l: ['#6250d6', '#ecebfb'], d: ['#9d93ee', '#25213f'] },
  gruen: { name: 'Grün', l: ['#2f7d32', '#e5f2e5'], d: ['#6cc070', '#1b2e1c'] },
  grafit: { name: 'Grafit', l: ['#3d4b53', '#e6eaec'], d: ['#b5c2c9', '#253136'] }
};
const FONT_SIZES = { s: ['Klein', 13], m: ['Normal', 14], l: ['Groß', 16], xl: ['Sehr groß', 18] };
const THEMES = { system: 'Wie das System', light: 'Hell', dark: 'Dunkel' };
const Prefs = {
  KEY: 'kontor-darstellung',
  v: { font: 'm', theme: 'system', palette: 'petrol' },
  load() { try { Object.assign(this.v, JSON.parse(localStorage.getItem(this.KEY)) || {}); } catch (e) { } this.apply(); },
  set(k, val) { this.v[k] = val; try { localStorage.setItem(this.KEY, JSON.stringify(this.v)); } catch (e) { } this.apply(); },
  dark() { return this.v.theme === 'dark' || (this.v.theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches); },
  apply() {
    const r = document.documentElement, f = FONT_SIZES[this.v.font] || FONT_SIZES.m, p = PALETTES[this.v.palette];
    r.style.setProperty('--fs', f[1] + 'px');
    if (THEMES[this.v.theme] && this.v.theme !== 'system') r.setAttribute('data-theme', this.v.theme); else r.removeAttribute('data-theme');
    if (p && this.v.palette !== 'petrol') { const [a, s] = this.dark() ? p.d : p.l; r.style.setProperty('--accent', a); r.style.setProperty('--accent-soft', s); }
    else { r.style.removeProperty('--accent'); r.style.removeProperty('--accent-soft'); }
  }
};
Prefs.load();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => Prefs.apply());
function prefsForm() {
  const v = Prefs.v, radio = (name, val, label, cur) => `<label><input type="radio" name="${name}" value="${val}" ${val === cur ? 'checked' : ''}><span>${label}</span></label>`;
  return `<form id="ed-form" class="ed" novalidate>
    <div class="row spread"><h2>Einstellungen</h2><button type="button" class="icon" data-ed="close" aria-label="Schließen">✕</button></div>
    <div class="field"><span>Schriftgröße</span><div class="seg" role="radiogroup" aria-label="Schriftgröße">${Object.entries(FONT_SIZES).map(([k, [l]]) => radio('pf-font', k, l, v.font)).join('')}</div></div>
    <div class="field"><span>Hell oder dunkel</span><div class="seg" role="radiogroup" aria-label="Hell oder dunkel">${Object.entries(THEMES).map(([k, l]) => radio('pf-theme', k, l, v.theme)).join('')}</div></div>
    <div class="field"><span>Farbschema</span><div class="swatches" role="radiogroup" aria-label="Farbschema">${Object.entries(PALETTES).map(([k, p]) =>
      `<label><input type="radio" name="pf-palette" value="${k}" ${k === v.palette ? 'checked' : ''}><i style="background:${Prefs.dark() ? p.d[0] : p.l[0]}"></i>${p.name}</label>`).join('')}</div></div>
    <p class="muted">Die Einstellungen gelten nur für diesen Browser. Auf dem Handy kannst du andere wählen.</p>
    <div class="row spread ed-foot"><span class="muted">${Server.info && Server.info.version ? 'Kontor ' + esc(Server.info.version) : ''}</span><button type="button" class="primary" data-ed="close">Fertig</button></div>
  </form>`;
}

/* ---------- Speicher ----------
   Im Prototyp lokal im Browser. Für Unraid wird dieses Objekt durch Aufrufe an die Server-API ersetzt. */
/* ---------- Server (Unraid-Container) ----------
   Wird die App vom Kontor-Server geladen, liegen die Daten dort. localStorage bleibt Zwischenspeicher.
   Ohne Server (Datei direkt geöffnet) läuft alles wie bisher nur im Browser.
   Konflikte: Jeder Stand hat eine Nummer (rev). Hat ein anderes Gerät inzwischen gespeichert, lehnt der Server ab. */
const Server = {
  ok: false, info: null, rev: null, pending: null, timer: null, busy: false, again: false, conflict: false, failed: false,
  async boot() {
    if (!/^https?:$/.test(location.protocol)) return;
    try {
      const h = await fetch('api/health', { cache: 'no-store' }); if (!h.ok) return;
      const j = await h.json(); if (!j || !j.ok || !('fints' in j)) return; this.info = j;
      if (j.version) $('#brand-ver').textContent = 'v' + j.version;
    } catch (e) { return; }
    let j;
    try { const r = await fetch('api/data', { cache: 'no-store' }); if (!r.ok) throw new Error('HTTP ' + r.status); j = await r.json(); }
    catch (e) { toast('Server erreicht, aber die Daten ließen sich nicht laden: ' + e.message); return; }
    this.ok = true; this.rev = j.rev;
    fetch('api/backups', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(b => { this.backups = b; if (b && location.hash === '#konten') render(); }).catch(() => { });
    if (j.data) { DB = ensureModel(j.data); Store.local(DB); }
    else if (DB.tx.length || Object.keys(DB.accounts).length) { this.queue(DB); toast('Deine Daten aus diesem Browser werden jetzt auf dem Server gespeichert.', null, 8000); }
    updateFoot(); render(); Drop.start();
    // Kurse für Fonds in Rentenverträgen, höchstens alle 15 Minuten
    const age = quoteAge(); if (pensionIsins().length && (!age || Date.now() - Date.parse(age) > 15 * 60e3)) setTimeout(() => refreshQuotes(true), 1500);
  },
  queue(d) {
    if (!this.ok || this.conflict) return;
    this.pending = d; clearTimeout(this.timer); this.timer = setTimeout(() => this.push(), 600);
  },
  async push() {
    if (!this.pending) return;
    if (this.busy) { this.again = true; return; }
    this.busy = true; const d = this.pending; this.pending = null;
    try {
      const r = await fetch('api/data', { method: 'PUT', headers: { 'Content-Type': 'application/json', 'If-Match': String(this.rev) }, body: JSON.stringify(d) });
      if (r.status === 409) {
        this.conflict = true; updateFoot();
        toast('Auf dem Server liegt ein neuerer Stand, vermutlich von einem anderen Gerät. Deine letzte Änderung ist nur in diesem Browser.', { label: 'Neu laden', run: () => location.reload() }, 60000);
        return;
      }
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'HTTP ' + r.status);
      this.rev = (await r.json()).rev;
      if (this.failed) { this.failed = false; updateFoot(); toast('Server wieder erreichbar, alles gespeichert.'); }
    } catch (e) {
      if (!this.pending) this.pending = d;
      if (!this.failed) { this.failed = true; updateFoot(); toast('Server nicht erreichbar. Änderungen bleiben vorerst in diesem Browser, ich versuche es weiter.', null, 8000); }
      setTimeout(() => this.push(), 15000);
    } finally {
      this.busy = false;
      if (this.again) { this.again = false; this.push(); }
    }
  }
};
function updateFoot() {
  const el = document.querySelector('.foot'); if (!el) return;
  el.textContent = !Server.ok ? 'Prototyp. Daten bleiben in diesem Browser.'
    : Server.conflict ? 'Neuerer Stand auf dem Server. Bitte neu laden.'
    : Server.failed ? 'Server nicht erreichbar. Änderungen nur in diesem Browser.'
    : 'Daten liegen auf deinem Server.';
}
window.addEventListener('beforeunload', e => { if (Server.pending || Server.busy) { e.preventDefault(); e.returnValue = ''; } });
const Store = {
  KEY: 'finanzmanager-v1',
  local(d) { try { localStorage.setItem(this.KEY, JSON.stringify(d)); } catch (e) { } },
  empty: () => ({ version: 1, seq: 0, accounts: {}, institutes: {}, categories: {}, classes: [], tx: [], imports: [] }),
  load() {
    try { const d = JSON.parse(localStorage.getItem(this.KEY)); if (d && d.version === 1) return d; } catch (e) { }
    return this.empty();
  },
  save(d) {
    Server.queue(d);
    try { localStorage.setItem(this.KEY, JSON.stringify(d)); return true; }
    catch (e) { if (Server.ok) return true; toast('Speichern fehlgeschlagen: ' + e.message); return false; }
  }
};
/* ---------- Institute ----------
   Bekannte Institute werden am Kontonamen erkannt. Das Logo ist ein Farbfeld mit Kürzel;
   ein eigenes Logo kann hochgeladen werden. Es werden keine Bilder aus dem Internet geladen. */
const KNOWN_INST = [
  { key: 'ing', name: 'ING', match: /\bing\b|ing-diba/i, blz: '50010517', color: '#FF6200', fg: '#ffffff' },
  { key: 'postbank', name: 'Postbank', match: /postbank/i, blz: '37010050', color: '#FFCC00', fg: '#1a1a1a' },
  { key: 'psd', name: 'PSD Bank', match: /\bpsd\b/i, blz: '37060993', color: '#00775A', fg: '#ffffff' },
  { key: 'amazon', name: 'Amazon Visa', match: /amazon|\bvisa\b/i, color: '#232F3E', fg: '#FF9900' },
  { key: 'badenia', name: 'Bausparkasse Badenia', match: /badenia/i, color: '#004A93', fg: '#ffffff' },
  { key: 'sparkasse', name: 'Sparkasse', match: /sparkasse/i, color: '#E60000', fg: '#ffffff' },
  { key: 'volksbank', name: 'Volksbank', match: /volksbank|raiffeisen|\bvb\b/i, color: '#0066B3', fg: '#ffffff' },
  { key: 'dkb', name: 'DKB', match: /\bdkb\b/i, color: '#148DEA', fg: '#ffffff' },
  { key: 'comdirect', name: 'comdirect', match: /comdirect/i, color: '#FFF500', fg: '#1a1a1a' },
  { key: 'traderepublic', name: 'Trade Republic', match: /trade ?republic/i, color: '#111111', fg: '#ffffff' }
];
function newInstitute(id, name, extra) {
  return Object.assign({ id, name, blz: '', bic: '', color: '#5b6b74', fg: '#ffffff', logo: '',
    online: { method: 'none', url: '', login: '', customer: '', tan: '', since: '' } }, extra || {});
}
function ensureInstitutes(d) {
  d.institutes = d.institutes || {};
  for (const a of Object.values(d.accounts)) {
    if (a.inactive === undefined) a.inactive = false;
    if (a.iban === undefined) a.iban = '';
    if (!a.number) { const m = (a.desc || '').match(/Kontonr\.?\s*([\dXx]+)/i); a.number = m ? m[1] : ''; }
    if (a.institute !== undefined && (a.institute === '' || d.institutes[a.institute])) continue;
    const k = KNOWN_INST.find(k => k.match.test(a.name));
    if (k) {
      if (!d.institutes[k.key]) d.institutes[k.key] = newInstitute(k.key, k.name, { blz: k.blz || '', color: k.color, fg: k.fg });
      a.institute = k.key;
    } else a.institute = '';
  }
  return d;
}
function initials(name) {
  const w = name.replace(/\b(bausparkasse|bank)\b/ig, '').trim().split(/\s+/).filter(Boolean);
  if (!w.length) return name.slice(0, 1).toUpperCase();
  if (/^[A-ZÄÖÜ]{2,4}$/.test(w[0])) return w[0];
  return w.slice(0, 2).map(x => x[0]).join('').toUpperCase();
}
function logo(inst, size = 36) {
  const st = `width:${size}px;height:${size}px;font-size:${Math.round(size * .36)}px`;
  if (!inst) return `<span class="logo none" style="${st}" aria-hidden="true">?</span>`;
  if (inst.logo) return `<img class="logo img" src="${esc(inst.logo)}" style="${st}" alt="">`;
  const safe = c => /^#[0-9a-f]{6}$/i.test(c) ? c : '#5b6b74';
  return `<span class="logo" style="${st};background:${safe(inst.color)};color:${safe(inst.fg)}" aria-hidden="true">${esc(initials(inst.name))}</span>`;
}
function ibanOk(s) {
  s = (s || '').replace(/\s/g, '').toUpperCase();
  if (!/^[A-Z]{2}\d{2}[A-Z0-9]{10,30}$/.test(s)) return false;
  const r = (s.slice(4) + s.slice(0, 4)).replace(/[A-Z]/g, c => c.charCodeAt(0) - 55);
  let m = 0; for (const ch of r) m = (m * 10 + +ch) % 97;
  return m === 1;
}
const fmtIban = s => (s || '').replace(/\s/g, '').toUpperCase().replace(/(.{4})/g, '$1 ').trim();
function onlineStatus(i) {
  const o = i.online || {};
  if (o.method === 'fints') return i.blz && o.url && o.login ? ['FinTS vorbereitet', 'ok'] : ['FinTS unvollständig', 'warn'];
  if (o.method === 'psd2') return ['PSD2 vorgemerkt', ''];
  return ['Nur Datei-Import', ''];
}
const activeNames = () => new Set(Object.values(DB.accounts).filter(a => !a.inactive).map(a => a.name));
const slug = s => String(s).replace(/[^a-z0-9]/gi, '_');

/* ---------- Datenmodell ergänzen ----------
   Tags: Quicken-Klassen werden zu Tags. Umbuchungen: beide Seiten werden miteinander verknüpft,
   damit eine Änderung auf einer Seite auch die andere Seite ändert. */
function ensureModel(d) {
  ensureInstitutes(d);
  d.tags = d.tags || [];
  d.rules = d.rules || [];
  d.ruleIgnore = d.ruleIgnore || [];
  d.contracts = d.contracts || [];
  d.contractIgnore = d.contractIgnore || [];
  d.loans = d.loans || [];
  d.statements = d.statements || [];
  d.csvMaps = d.csvMaps || {};
  d.groups = d.groups || [];
  for (const c of d.classes || []) if (c && !d.tags.includes(c)) d.tags.push(c);
  for (const t of d.tx) {
    if (!t.tags) {
      const s = new Set(); if (t.cls) s.add(t.cls);
      for (const x of t.splits || []) if (x.cls) s.add(x.cls);
      t.tags = [...s];
    }
    for (const g of t.tags) if (!d.tags.includes(g)) d.tags.push(g);
    if (!t.key) t.key = 'm' + t.id;
  }
  d.tags.sort((a, b) => a.localeCompare(b, 'de'));
  linkTransfers(d);
  if (!d.counterpartsV1 && d.tx.length) {
    // Einmalige Nachbesserung für Daten, die vor dieser Version importiert wurden
    const n = addCounterparts(d, d.tx.slice());
    d.counterpartsV1 = true;
    d.tx.sort((a, b) => a.date.localeCompare(b.date) || a.id - b.id);
    Store.save(d);
    if (n) setTimeout(() => toast(`${n} fehlende Gegenbuchungen von Umbuchungen ergänzt.`, null, 8000), 300);
  } else d.counterpartsV1 = true;
  if (!d.splitFixV2) {
    // Korrektur: Splitbuchungen mit zusätzlicher Umbuchung in der Hauptzeile (doppelte Gegenbuchung)

/* Quicken schreibt eine Umbuchung beim QIF-Export nur in eines der beiden Konten.

function addCounterparts(d, txs) {

    for (const s of t.splits || []) if (s.transfer && s.transfer !== t.acct) parts.push({ to: s.transfer, amount: s.amount, split: true });

      if (!p.split) {
        const o = d.tx.find(x => x !== t && !x.link && x.acct === p.to && x.transfer === t.acct && x.amount === -p.amount && x.date === t.date);
        if (o) { o.link = t.id; t.link = o.id; continue; }

        payee: t.payee, memo: t.memo, number: '', cleared: '', category: '', cls: '', transfer: t.acct, splits: [], tags: (t.tags || []).slice(), gen: t.id };

    const list = open.get(`${t.transfer}|${t.acct}|${t.date}|${-t.amount}`);
    if (list && list.length) { const o = list.shift(); o.link = t.id; t.link = o.id; continue; }
    const mk = `${t.acct}|${t.transfer}|${t.date}|${t.amount}`;
    if (!open.has(mk)) open.set(mk, []);

/* ---------- Umbuchungen von Hand zuordnen ----------
   Gegenstück: zuerst eine offene Buchung im Zielkonto (gleicher Betrag mit umgekehrtem Vorzeichen, ±3 Tage,
   ohne Kategorie oder schon als Umbuchung auf dieses Konto markiert). Gibt es keine, wird eine Gegenbuchung erzeugt. */
const dayDist = (a, b) => Math.abs(Date.parse(a) - Date.parse(b)) / 864e5;
/* Gegenstück suchen: gleicher Betrag mit umgekehrtem Vorzeichen, höchstens 5 Tage auseinander, noch nicht verknüpft.
   Auch Buchungen mit einer Kategorie wie „Umbuchung“ oder „Sparen“ zählen, sie werden dann zur Umbuchung.
   Reihenfolge: schon als Umbuchung auf dieses Konto markiert, dann ohne Kategorie, dann Kategorie nach Umbuchung klingend, dann andere; jeweils das nächste Datum. */

  if (x.transfer) return x.transfer === fromAcct ? 0 : 9;

  return XFER_CAT.test(x.category) ? 2 : 3;
}
function findCounterpart(t, to, d = DB, maxRank = 2) {
  let best = null, bk = 99;

    const dist = dayDist(x.date, t.date); if (dist > 5) continue;
    const rank = counterpartRank(x, t.acct); if (rank > maxRank) continue;
    const k = rank * 10 + dist; if (k < bk) { best = x; bk = k; }

  return best;
}
/* Erzeugte Gegenbuchungen, neben denen im selben Konto schon die echte Buchung steht: echte verknüpfen, erzeugte entfernen. */
function dedupeTransfers(d) {
  let n = 0;

    const src = d.tx.find(x => x.id === g.link); if (!src) continue;
    const real = findCounterpart(src, g.acct, d); if (!real || real === g) continue;
    real.transfer = src.acct; real.category = ''; delete real.byRule; real.link = src.id; src.link = real.id;
    d.tx = d.tx.filter(x => x !== g); n++;

}
/* Löst die Verknüpfung. Erzeugte oder von Hand angelegte Gegenbuchungen verschwinden,

function unlinkCounterpart(t) {
  const o = t.link ? DB.tx.find(x => x.id === t.link) : null;
  delete t.link; if (!o) return null;
  delete o.link;
  if (o.gen === t.id || (!o.imp && String(o.key || '').startsWith('m'))) { DB.tx = DB.tx.filter(x => x !== o); return 'deleted'; }
  o.transfer = null; o.category = ''; return o;
}
/* Buchung zur Umbuchung machen: vorhandenes Gegenstück verknüpfen oder Gegenbuchung anlegen.
   Liefert, was rückgängig zu machen wäre: { linked, prevO } oder { created }. */
function linkTransfer(t, to) {

  if (o) {
    const prevO = { transfer: o.transfer || null, category: o.category, link: o.link, byRule: o.byRule };
    o.transfer = t.acct; o.category = ''; delete o.byRule; o.link = t.id; t.link = o.id;
    return { linked: o.id, prevO, date: o.date };
  }
  const c = { id: ++DB.seq, imp: null, key: 'gen|' + t.key + '|' + to + '|' + t.amount, acct: to, date: t.date, amount: -t.amount,
    payee: t.payee, memo: t.memo, number: '', cleared: '', category: '', cls: '', transfer: t.acct, splits: [], tags: (t.tags || []).slice(), gen: t.id, link: t.id };
  t.link = c.id; DB.tx.push(c);

function setTransfer(id, to) {
  const t = DB.tx.find(x => x.id === id); if (!t || to === t.acct) return;
  if ((t.transfer || '') === (to || '')) return;
  const snap = JSON.stringify(DB.tx);
  const freed = unlinkCounterpart(t);
  const arrow = t.amount < 0 ? 'nach' : 'von';
  let msg;
  if (!to) { t.transfer = null; msg = 'Keine Umbuchung mehr. Wähle jetzt eine Kategorie.'; }
  else {
    const r = linkTransfer(t, to);
    msg = r.linked ? `Umbuchung ${arrow} „${to}“: mit der Buchung vom ${dDE(r.date)} dort verknüpft.` : `Umbuchung ${arrow} „${to}“: dort gab es kein Gegenstück, die Gegenbuchung wurde angelegt.`;
  }
  if (freed && freed !== 'deleted') msg += ` Die bisherige Gegenbuchung in „${freed.acct}“ steht jetzt ohne Kategorie da.`;
  save(); render();
  toast(msg, { label: 'Rückgängig', run: () => { DB.tx = JSON.parse(snap); save(); render(); toast('Rückgängig gemacht.'); } }, 9000);

/* Hinweise für Buchungen ohne Kategorie, die nach Umbuchung aussehen:

function xferIndex() {

}
/* Kategorie wie „Umbuchung“ statt echter Umbuchung: auch dafür Vorschläge zeigen */
const XFER_ONLY = /umbuch|übertrag|uebertrag|transfer/i;

  for (const a of Object.values(DB.accounts)) {

    if (iban && flat.includes(iban)) return { acct: a.name, why: `Die IBAN von „${a.name}“ steht im Verwendungszweck.` };
    if (/^\d{6,}$/.test(num) && new RegExp('(^|\\D)0*' + num.replace(/^0+/, '') + '(\\D|$)').test(raw)) return { acct: a.name, why: `Die Kontonummer von „${a.name}“ steht im Verwendungszweck.` };

  if (/umbuch|übertrag|uebertrag|eigenes konto|eigenübertrag/i.test(raw)) return { acct: '', why: 'Der Text klingt nach Umbuchung. Wähle das Gegenkonto.' };

function xferOptions(t, cur, placeholder) {

let DB = ensureModel(Store.load());

/* ---------- QIF-Parser ---------- */
const QIF = {
  decode(buf) {
    try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); }
    catch (e) { return new TextDecoder('windows-1252').decode(buf); }
  },
  amount(s) {
    s = String(s ?? '').trim().replace(/[\s€]/g, '');
    if (!s) return 0;
    const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
    if (lc < 0 && /^[-+]?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, ''); // „200.000“ = 200 000 (deutsche Tausenderpunkte)
    else s = lc > ld ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
    const v = Math.round(parseFloat(s) * 100);
    if (!isFinite(v)) throw new Error('Betrag nicht lesbar: ' + s);
    return v;
  },
  cat(L) {
    L = String(L ?? '').trim();
    if (!L) return { category: '', cls: '', transfer: null };
    const m = L.match(/^(\[[^\]]*\]|[^/]*)(?:\/(.*))?$/);
    const main = m ? m[1].trim() : L, cls = m && m[2] ? m[2].trim() : '';
    if (main.startsWith('[') && main.endsWith(']')) return { category: '', cls, transfer: main.slice(1, -1) };
    return { category: main, cls, transfer: null };
  },
  parse(text) {
    const res = { option: null, accounts: [], categories: [], classes: [], tx: [], problems: [], skipped: {} };
    const TXSEC = /^(Bank|Cash|CCard|Oth\b.*)$/i;
    let section = null, acct = null, rec = {}, splits = [];
    const end = no => {
      if (section === 'Class') { if (rec.N) res.classes.push(rec.N.trim()); }
      else if (section === 'Cat') { if (rec.N) res.categories.push({ name: rec.N.trim(), desc: rec.D || '', income: 'I' in rec }); }
      else if (section === 'Account') {
        if (rec.N) {
          acct = rec.N.trim();
          if (!res.accounts.some(a => a.name === acct)) res.accounts.push({ name: acct, type: (rec.T || '').trim(), desc: (rec.D || '').trim() });
        }
      }
      else if (section && TXSEC.test(section)) {
        if (!acct) res.problems.push(`Zeile ${no}: Buchung ohne Konto`);
        else if (!rec.D) res.problems.push(`Zeile ${no}: Buchung ohne Datum`);
        else try {
          const amount = QIF.amount(rec.T ?? rec.U ?? '0');
          const t = Object.assign({ acct, rawDate: rec.D, amount, payee: (rec.P || '').trim(), memo: (rec.M || '').trim(), number: (rec.N || '').trim(), cleared: (rec.C || '').trim(), splits: [], line: no }, QIF.cat(rec.L));
          if (splits.length) {
            t.splits = splits.map(s => Object.assign({ memo: (s.E || '').trim(), amount: QIF.amount(s.$ || '0') }, QIF.cat(s.S)));
            const sum = t.splits.reduce((a, s) => a + s.amount, 0);
            if (sum !== amount) res.problems.push(`Zeile ${no}: Splits ergeben ${money(sum)}, die Buchung ${money(amount)}`);
            // Bei Splits wiederholt Quicken in L nur die erste Teilkategorie; maßgeblich sind die Splits.
            t.category = ''; t.transfer = null; t.cls = t.cls || '';
          }
          res.tx.push(t);
        } catch (e) { res.problems.push(`Zeile ${no}: ${e.message}`); }
      }
      else if (section) res.skipped[section] = (res.skipped[section] || 0) + 1;
      rec = {}; splits = [];
    };
    text.split(/\r?\n/).forEach((ln, i) => {
      if (!ln.trim()) return;
      if (ln[0] === '!') {
        const h = ln.trim();
        if (/^!Option:(MDY|DMY)$/i.test(h)) res.option = h.slice(8).toUpperCase();
        else if (/^!Type:/i.test(h)) section = h.slice(6).trim();
        else if (/^!Account$/i.test(h)) section = 'Account';
        rec = {}; splits = [];
        return;
      }
      const c = ln[0], v = ln.slice(1);
      if (c === '^') return end(i + 1);
      if (c === 'S') splits.push({ S: v });
      else if ((c === '$' || c === 'E') && splits.length) splits[splits.length - 1][c] = v;
      else rec[c] = v;
    });
    // Datumsformat: Quicken schreibt meist Monat.Tag.Jahr (!Option:MDY)
    const parts = res.tx.map(t => (t.rawDate.match(/(\d+)\D+(\d+)\D+(\d+)/) || []).slice(1).map(Number));
    let order = res.option;
    if (!order) { order = parts.some(p => p[0] > 12) ? 'DMY' : 'MDY'; res.guessed = true; }
    res.order = order;
    res.tx.forEach((t, i) => {
      const p = parts[i];
      if (p.length < 3) { res.problems.push(`Zeile ${t.line}: Datum nicht lesbar (${t.rawDate})`); return; }
      let [a, b, y] = p; const [m, d] = order === 'MDY' ? [a, b] : [b, a];
      if (y < 100) y += y < 50 ? 2000 : 1900;
      if (m < 1 || m > 12 || d < 1 || d > 31) { res.problems.push(`Zeile ${t.line}: ungültiges Datum (${t.rawDate})`); return; }
      t.date = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    });
    res.tx = res.tx.filter(t => t.date);
    return res;
  }
};

/* ---------- Auswertungen ---------- */
const displayPayee = t => t.payee || t.memo || '';
function flows(t) {
  if (t.splits && t.splits.length) return t.splits.filter(s => !s.transfer).map(s => ({ cat: s.category, amount: s.amount }));
  return t.transfer ? [] : [{ cat: t.category, amount: t.amount }];
}
const isUncategorized = t => !(t.splits && t.splits.length) && !t.transfer && !t.category;
function balance(name, upto = TODAY) {
  const a = DB.accounts[name]; let s = a ? a.opening || 0 : 0;
  for (const t of DB.tx) if (t.acct === name && t.date <= upto) s += t.amount;
  return s;
}

/* ---------- Kontogruppen ----------
   Automatisch nach Kontoart, dazu eigene Gruppen (DB.groups). Ein Konto darf in mehreren eigenen Gruppen stehen.
   Im Kontofilter der Buchungen steht eine Gruppe als „g:type:<Art>“ oder „g:grp:<id>“. */
function acctSet(sel) {
  if (!sel) return null;
  if (sel.startsWith('g:type:')) { const k = sel.slice(7); return new Set(Object.values(DB.accounts).filter(a => typeGroup(a.type) === k).map(a => a.name)); }
  if (sel.startsWith('g:grp:')) { const g = DB.groups.find(x => x.id === sel.slice(6)); return new Set(g ? g.accts : []); }
  return new Set([sel]);
}
const isGroupSel = sel => /^g:/.test(sel || '');
/* Konten in Gruppen aufteilen: mode 'type' oder 'own'; liefert [{ name, sel, accts }] */
function groupAccounts(list, mode) {
  if (mode === 'own') {
    const out = DB.groups.map(g => ({ name: g.name, sel: 'g:grp:' + g.id, accts: list.filter(a => g.accts.includes(a.name)) })).filter(g => g.accts.length);
    const rest = list.filter(a => !DB.groups.some(g => g.accts.includes(a.name)));
    if (rest.length) out.push({ name: 'Ohne Gruppe', sel: '', accts: rest });
    return out;
  }
  return Object.entries(TYPE_GROUPS).map(([k, name]) => ({ name, sel: 'g:type:' + k, accts: list.filter(a => typeGroup(a.type) === k) })).filter(g => g.accts.length);
}
/* Optionen für einen Kontofilter: Gruppen (Art und eigene), danach die einzelnen Konten */
function acctFilterOptions(cur, withInactive = true) {
  const all = Object.values(DB.accounts).filter(a => withInactive || !a.inactive);
  const opt = (v, l) => `<option value="${esc(v)}" ${v === cur ? 'selected' : ''}>${esc(l)}</option>`;
  const types = groupAccounts(all, 'type').map(g => opt(g.sel, `${g.name} (${g.accts.length})`)).join('');
  const own = DB.groups.map(g => opt('g:grp:' + g.id, `${g.name} (${g.accts.filter(n => DB.accounts[n]).length})`)).join('');
  const accts = all.sort((a, b) => (a.inactive - b.inactive) || a.name.localeCompare(b.name, 'de')).map(a => opt(a.name, a.name + (a.inactive ? ' (inaktiv)' : ''))).join('');
  return `<optgroup label="Nach Kontoart">${types}</optgroup>${own ? `<optgroup label="Eigene Gruppen">${own}</optgroup>` : ''}<optgroup label="Konten">${accts}</optgroup>`;
}

/* ---------- Zinsen (Tagesgeld, Sparkonto) und Rentenkonten ---------- */
const hasRates = a => !!a && (a.type === 'Save' || a.type === 'Oth T');
const pctDE = r => (+r).toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 3 }) + ' %';
/* Zinssatz am Tag d aus dem Verlauf [{ from, rate }] */
function rateAt(a, d = TODAY) {
  let r = null;
  for (const x of (a.rates || []).slice().sort((p, q) => p.from.localeCompare(q.from))) if (x.from <= d) r = x.rate;
  return r;
}
/* Zinsen eines Jahres, tagesgenau: Tagesendsaldo × gültiger Satz / Tage des Jahres.
   Bis heute mit den echten Buchungen, danach mit dem bekannten Saldo und den eingetragenen Sätzen (Hochrechnung). */
function interestYear(a, year) {
  if (!(a.rates || []).length) return null;
  const leap = (y => (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0)(+year), days = leap ? 366 : 365;
  const list = DB.tx.filter(t => t.acct === a.name && t.date.startsWith(year)).sort((p, q) => p.date.localeCompare(q.date));
  let bal = balance(a.name, `${+year - 1}-12-31`), i = 0, sofar = 0, total = 0;
  const d = new Date(Date.UTC(+year, 0, 1));
  for (let k = 0; k < days; k++, d.setUTCDate(d.getUTCDate() + 1)) {
    const ds = d.toISOString().slice(0, 10);
    while (i < list.length && list[i].date <= ds) bal += list[i++].amount;
    const r = rateAt(a, ds); if (!r || bal <= 0) continue;
    const z = bal * r / 100 / days; total += z; if (ds <= TODAY) sofar += z;
  }

  });

function saveAcct() {
  readAcct();
  const e = ED, name = e.name.trim(), type = e.type, inst = e.institute || '';
  if (!name) return toast('Bitte einen Namen eingeben.');
  let rates = null, pension = null;
  if (type === 'Save' || type === 'Oth T') {
    const rs = e.rates.filter(r => r.from || r.rate !== '');
    if (rs.some(r => !/^\d{4}-\d{2}-\d{2}$/.test(r.from) || r.rate === '' || isNaN(r.rate) || r.rate < -5 || r.rate > 30)) return toast('Jeder Zinssatz braucht ein Datum und einen Satz in Prozent, z. B. 2,25.');
    if (new Set(rs.map(r => r.from)).size < rs.length) return toast('Zwei Zinssätze haben dasselbe Datum.');
    rates = rs.sort((p, q) => p.from.localeCompare(q.from));
  }
  if (type === 'Pens') {
    if (isNaN(e.pension.amount)) return toast('Betrag der Auszahlung nicht lesbar.');
    const fs = e.pension.funds.filter(f => f.name || f.isin || f.units !== '' || f.price !== '');
    if (fs.some(f => f.units === '' || isNaN(f.units) || f.units < 0 || (f.price !== '' && (isNaN(f.price) || f.price < 0)))) return toast('Bitte bei jedem Fonds die Anteile als Zahl eintragen, z. B. 110,3282.');
    if (fs.some(f => f.isin && !/^[A-Z]{2}[A-Z0-9]{9}\d$/.test(f.isin))) return toast('Eine ISIN hat 12 Zeichen, z. B. LU0309483781.');
    pension = { date: e.pension.date || '', kind: e.pension.kind, amount: e.pension.amount || 0, contract: e.pension.contract || '',
      funds: fs.map(f => ({ name: f.name || f.isin, isin: f.isin, units: +f.units, price: f.price === '' ? 0 : +f.price, date: f.date || '' })) };
  }
  if (name !== e.orig && DB.accounts[name]) return toast('Ein Konto mit diesem Namen gibt es schon.');
  if (!e.orig) {
    let opening = 0; try { opening = QIF.amount(e.openRaw || '0'); } catch (err) { return toast('Anfangssaldo nicht lesbar.'); }
    DB.accounts[name] = { name, type, institute: inst, opening, desc: '', iban: '', number: '', inactive: false };
  } else {
    if (name !== e.orig) renameAccount(e.orig, name);
    Object.assign(DB.accounts[name], { type, institute: inst });
  }
  if (rates) DB.accounts[name].rates = rates;
  if (pension) DB.accounts[name].pension = pension;
  save(); closeDialog(); render(); toast(e.orig ? 'Konto gespeichert.' : `Konto „${name}“ angelegt.`);
}

/* Vorschläge: Empfänger, die fast immer dieselbe Kategorie haben */
function suggestRules() {
  const g = {};
  for (const t of DB.tx) {
    if (t.transfer || (t.splits && t.splits.length)) continue;
    const key = (t.payeeOrig || t.payee || t.memo || '').trim();
    if (key.length < 3) continue;
    const e = g[key] = g[key] || { cats: {}, n: 0, open: 0, sample: t };
    if (t.category) { e.cats[t.category] = (e.cats[t.category] || 0) + 1; e.n++; } else e.open++;
  }
  const out = [];
  for (const [key, e] of Object.entries(g)) {
    if (e.n < 2) continue;
    const [cat, c] = Object.entries(e.cats).sort((a, b) => b[1] - a[1])[0];
    if (c / e.n < .8 || (e.n < 3 && !e.open)) continue;
    if (DB.rules.some(r => ruleMatches(r, e.sample))) continue;
    if ((DB.ruleIgnore || []).includes(key)) continue;
    out.push({ key, category: cat, n: e.n, share: Math.round(c / e.n * 100), open: e.open });
  }
  return out.sort((a, b) => b.open - a.open || b.n - a.n).slice(0, 15);
}

/* Neu scannen: Vorschläge neu berechnen und merken, was seit dem letzten Scan dazugekommen ist. */
function rescanContracts() {
  const prev = DB.contractScan ? DB.contractScan.keys : null;
  const sugg = suggestContracts(), keys = sugg.map(s => s.key);
  const newKeys = prev ? keys.filter(k => !prev.includes(k)) : keys.slice();
  const gone = prev ? prev.filter(k => !keys.includes(k)).length : 0;
  DB.contractScan = { date: new Date().toISOString(), keys, newKeys };
  const unmatched = DB.contracts.filter(c => c.match && !contractInfo(c).payments.length).length;
  save(); render();
  toast(`Scan fertig: ${sugg.length} regelmäßige Zahlungen erkannt${prev ? `, davon ${newKeys.length} neu` : ''}${gone ? `, ${gone} nicht mehr dabei` : ''}.${DB.contractIgnore.length ? ` ${DB.contractIgnore.length} ${DB.contractIgnore.length === 1 ? 'ist' : 'sind'} ausgeblendet.` : ''}${unmatched ? ` ${unmatched} ${unmatched === 1 ? 'Vertrag findet' : 'Verträge finden'} keine Zahlungen, prüfe dort den Suchbegriff.` : ''}`, null, 10000);

/* Erkennung wiederkehrender Zahlungen */
function suggestContracts() {
  const g = {};
  for (const t of DB.tx) {
    if (t.amount >= 0 || t.transfer || (t.splits && t.splits.length) || t.date > TODAY) continue;
    const k = displayPayee(t).trim(); if (k.length < 3) continue;
    (g[k] = g[k] || []).push(t);
  }
  const med = a => { const s = a.slice().sort((x, y) => x - y); return s[Math.floor(s.length / 2)]; };
  const out = [];
  for (const [k, list] of Object.entries(g)) {
    if (list.length < 3) continue;
    list.sort((a, b) => a.date.localeCompare(b.date));
    const gaps = list.slice(1).map((t, i) => daysBetween(list[i].date, t.date)).filter(d => d > 0);
    if (gaps.length < 2) continue;
    const mg = med(gaps);
    const interval = mg >= 5 && mg <= 9 ? 'weekly' : mg >= 25 && mg <= 36 ? 'monthly' : mg >= 80 && mg <= 100 ? 'quarterly' : mg >= 170 && mg <= 195 ? 'halfyear' : mg >= 350 && mg <= 380 ? 'yearly' : null;
    if (!interval) continue;
    if (gaps.filter(d => Math.abs(d - mg) <= mg * .25).length / gaps.length < .7) continue;
    const amts = list.map(t => -t.amount), ma = med(amts);
    if (amts.filter(a => Math.abs(a - ma) <= ma * .15).length / amts.length < .7) continue;
    if ((DB.contracts || []).some(c => c.match && (k.toLowerCase().includes(c.match.toLowerCase())))) continue;
    if ((DB.contractIgnore || []).includes(k)) continue;
    const mode = arr => { const m = {}; arr.forEach(x => { if (x) m[x] = (m[x] || 0) + 1; }); return Object.entries(m).sort((a, b) => b[1] - a[1])[0]?.[0] || ''; };
    const last = list[list.length - 1];
    out.push({ key: k, interval, amount: -last.amount, n: list.length, first: list[0].date, last: last.date,
      category: mode(list.map(t => t.category)), acct: mode(list.map(t => t.acct)) });
  }
  return out.sort((a, b) => perMonth(b) - perMonth(a));
}

/* ---------- Kredite & Schulden ----------
   Annuitätendarlehen: feste Rate, Zinsen auf die jeweilige Restschuld (Monatszins = Jahreszins / 12).
   Privat: kein fester Plan, nur Auszahlung und Rückzahlungen. */
function newLoan(extra) {
  return Object.assign({ id: 'l' + Date.now() + Math.floor(Math.random() * 1000), name: '', kind: 'annuity', direction: 'debt', lender: '',
    principal: 0, start: TODAY, rate: 0, payment: 0, interval: 'monthly', fixedUntil: '', extraPct: 5,
    balance: null, balanceDate: '', match: '', acct: '', note: '', extras: [] }, extra || {});
}
function annuity(principal, ratePct, years, per = 1) {
  const n = Math.round(years * 12 / per), r = ratePct / 100 / 12 * per;
  if (!n) return 0;
  return Math.ceil(r ? principal * r / (1 - Math.pow(1 + r, -n)) : principal / n);
}
function loanSchedule(l, sim = {}) {

  const extras = (l.extras || []).filter(e => e.date > anchorDate && e.amount > 0).map(e => Object.assign({}, e));
  // Privat mit verknüpftem Kreditkonto: Eingänge auf dem Konto sind Rückzahlungen

  if (sim.once > 0) extras.push({ date: sim.onceDate && sim.onceDate > TODAY ? sim.onceDate : TODAY, amount: sim.once, sim: true });
  extras.sort((a, b) => a.date.localeCompare(b.date));
  const payment = sim.newRate > 0 ? sim.newRate : l.payment;
  const rows = []; let bal = anchorBal, date = addMonths(anchorDate, per), guard = 0, neverEnds = false;
  const takeExtras = upto => {

async function commitCSV(stArg, opts = {}) {
  const st = stArg || UI.csv; if (!st || !st.acct) return;

    const blz = st.meta.iban && st.meta.iban.startsWith('DE') ? st.meta.iban.slice(4, 12) : '';
    const inst = Object.values(DB.institutes).find(i => blz && i.blz === blz) || null;
    DB.accounts[name] = { name, type: st.newType || 'Bank', institute: inst ? inst.id : '', opening: 0, desc: '', iban: st.meta.iban || '', number: (st.meta.number || '').replace(/\s/g, ''), inactive: false };

    const gone = DB.tx.filter(t => t.acct === st.acct && t.date >= from && t.date <= to);
    for (const t of gone) {
      const src = t.gen ? DB.tx.find(x => x.id === t.gen) : t.link ? DB.tx.find(x => x.id === t.link) : null;

  }

      if (src.splits && src.splits.length) { src.splits = []; src.category = ''; }

  DB.tx.sort((a, b) => a.date.localeCompare(b.date) || a.id - b.id);

  if (!cashName || !depName || cashName === depName) return toast('Bitte zwei verschiedene Konten wählen.');
  const snap = JSON.stringify(DB);
  const cashA = mk(o.cash, o.cashName, 'Bank'); if (!cashA) return;
  const depA = mk(o.depot, o.depotName, 'Port'); if (!depA) { DB = JSON.parse(snap); return; }
  ensureInstitutes(DB);
  // Früheren Import entfernen; Umbuchungen anderer Konten, die dorthin zeigten, auf das Cash-Konto umstellen
  const old = trOldImports(st); let removed = 0;
  if (o.dropOld && old.tx.length) {
    const gone = new Set(old.tx.map(t => t.id));
    for (const t of old.tx) {
      const other = t.link ? DB.tx.find(x => x.id === t.link) : null;
      if (other && !gone.has(other.id)) { if (other.gen) gone.add(other.id); else delete other.link; }
    }
    // Erzeugte Gegenbuchungen im alten Konto gehen mit; die echten Buchungen kommen aus der Datei
    for (const x of DB.tx) if (x.gen && old.accts.includes(x.acct)) gone.add(x.id);
    for (const x of DB.tx) if (!gone.has(x.id) && old.accts.includes(x.transfer) && !old.accts.includes(x.acct) && x.acct !== depA && (!x.link || gone.has(x.link))) { x.transfer = cashA; delete x.link; }
    DB.tx = DB.tx.filter(t => !gone.has(t.id)); removed = old.tx.length;
  }
  // Doppelte aus anderen Quellen im Zeitraum der Datei entfernen; ihre Kategorien werden unten übernommen

  if (ovl.length) {
    const gone = new Set(ovl.map(t => t.id));
    for (const t of ovl) {
      const other = t.link ? DB.tx.find(x => x.id === t.link) : null;
      if (other && !gone.has(other.id)) { if (other.gen) gone.add(other.id); else delete other.link; }

  }
  const plan = trPlan(st), keys = new Set(DB.tx.map(t => t.key)), impId = 'i' + Date.now(), byIdx = {}, added = [];
  plan.tx.forEach((t, i) => {
    if (keys.has(t.key)) return;
    const nt = { id: ++DB.seq, imp: impId, key: t.key, acct: t.side === 'cash' ? cashA : depA, date: t.date, amount: t.amount, payee: t.payee, memo: t.memo,
      number: '', cleared: '', category: t.xfer ? '' : t.category, cls: '', transfer: t.xfer ? (t.side === 'cash' ? depA : cashA) : null, splits: [], tags: [] };
    if (t.sec) nt.sec = t.sec;
    DB.tx.push(nt); added.push(nt); byIdx[i] = nt;
    if (t.category && !DB.categories[t.category]) DB.categories[t.category] = { name: t.category, income: TR_INCOME.has(t.category), desc: '' };
  });
  plan.tx.forEach((t, i) => { if (t.xfer && byIdx[i] && byIdx[t.pair]) byIdx[i].link = byIdx[t.pair].id; });
  // Umbuchungen aus anderen Konten auf das Cash-Konto mit den neuen Buchungen verknüpfen
  let relinked = 0;
  for (const n of added.filter(n => n.acct === cashA && !n.transfer)) {
    const src = DB.tx.find(x => x.acct !== cashA && x.transfer === cashA && !x.link && x.amount === -n.amount && Math.abs(daysBetween(x.date, n.date)) <= 3);
    if (!src) continue;
    src.link = n.id; n.transfer = src.acct; n.link = src.id; n.category = ''; relinked++;
  }
  const taken = new Set(), trTx = DB.tx.filter(n => String(n.key || '').startsWith('tr|'));
  for (const r of ovl.filter(r => (r.category && !r.transfer) || (r.tags || []).length)) {
    const fits = n => !taken.has(n.id) && n.acct === r.acct && n.amount === r.amount && !n.transfer && Math.abs(daysBetween(n.date, r.date)) <= 4;
    const n = trTx.find(n => fits(n) && !n.category) || trTx.find(fits);
    if (!n) continue; taken.add(n.id);
    if (r.category && !r.transfer && !n.category) n.category = r.category;
    if ((r.tags || []).length) n.tags = [...new Set([...(n.tags || []), ...r.tags])];
  }
  const merged = dedupeTransfers(DB);
  const ruled = applyRules(added.filter(n => !n.transfer && !n.category)).length;
  DB.tx.sort((a, b) => a.date.localeCompare(b.date) || a.id - b.id);
  DB.imports.push({ id: impId, file: st.file, date: new Date().toISOString(), count: added.length });
  await archiveImported(st, cashA);
  const empty = old.accts.filter(a => a !== cashA && a !== depA && DB.accounts[a] && !DB.tx.some(t => t.acct === a));
  if (UI.csv === st) UI.csv = null; save();
  const msg = `${added.filter(t => t.acct === cashA).length} Buchungen in „${cashA}“ und ${added.filter(t => t.acct === depA).length} in „${depA}“ importiert${removed ? `, ${removed} vom früheren Import ersetzt` : ''}${ovl.length ? `, ${ovl.length} doppelte aus anderen Importen ersetzt` : ''}${relinked + merged ? `, ${relinked + merged} Umbuchungen verknüpft` : ''}${ruled ? `, ${ruled} per Regel zugeordnet` : ''}.${empty.length ? ` „${empty.join('“, „')}“ ist jetzt leer und kann unter Konten & Daten gelöscht werden.` : ''}`;
  if (opts.auto) return msg;
  UI.f = Object.assign(NOFILTER(), { acct: cashA }); location.hash = 'buchungen'; render();
  toast(msg, { label: 'Rückgängig', run: () => { DB = JSON.parse(snap); save(); render(); toast('Import rückgängig gemacht.'); } }, 12000);
}

/* ---------- Online-Abruf per FinTS (läuft auf dem Server) ----------
   Die App schickt PIN und Zugangsdaten einmalig an den eigenen Server, der Server spricht mit der Bank.
   Während des Abrufs fragt die App alle 1,5 s den Stand ab und zeigt TAN-Abfragen an. */
const Fints = {
  timer: null,
  async call(path, body) {
    const r = await fetch('api/fints/' + path, body === undefined ? { cache: 'no-store' } : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status);
    return j;
  },
  poll() {
    clearTimeout(this.timer);
    if (!ED || ED.mode !== 'fints' || !ED.sess || !['running'].includes(ED.sess.state)) return;
    this.timer = setTimeout(async () => {
      if (!ED || ED.mode !== 'fints' || !ED.sess) return;
      try { this.update(await this.call(ED.sess.id)); } catch (e) { this.update({ state: 'error', message: e.message }); }
    }, 1500);
  },
  update(s) {
    if (!ED || ED.mode !== 'fints') return;
    const changed = !ED.sess || ED.sess.state !== s.state || ED.sess.message !== s.message;
    ED.sess = Object.assign({}, ED.sess, s);
    if (s.state === 'done' && s.result) fintsDone();
    if (changed) showDialog();
    this.poll();
  },
  stop() {
    clearTimeout(this.timer);
    if (ED && ED.mode === 'fints' && ED.sess && ED.sess.id && !['done', 'error'].includes(ED.sess.state)) this.call(ED.sess.id + '/cancel', {}).catch(() => {});
  }
};
function openFints(instId, kind) {
  const i = DB.institutes[instId]; if (!i) return;
  if (!Server.ok) return toast('Der Abruf geht nur, wenn die App von deinem Kontor-Server geladen wird.');
  if (!Server.info.fints) return toast('Im Container ist die FinTS-Bibliothek nicht installiert.');
  if (!Server.info.productId) return toast('Für den Abruf fehlt die FinTS-Produkt-ID. Sie wird bei der Deutschen Kreditwirtschaft beantragt und im Container als FINTS_PRODUCT_ID eingetragen.', null, 10000);
  const o = i.online;
  if (!/^\d{8}$/.test(i.blz || '') || !o.url || !o.login) return toast('Bitte zuerst Bankleitzahl, FinTS-Adresse und Anmeldename eintragen.');
  ED = { mode: 'fints', inst: instId, kind, sess: null, map: {}, imported: null };
  showDialog();
}
const ibanKey = s => String(s || '').replace(/\s/g, '').toUpperCase();
function fintsAcctFor(acc) {
  const iban = ibanKey(acc.iban), num = String(acc.number || '').replace(/^0+/, '');
  const a = Object.values(DB.accounts).find(a => iban && ibanKey(a.iban) === iban)
    || Object.values(DB.accounts).find(a => num.length >= 5 && String(a.number || '').replace(/\D/g, '').replace(/^0+/, '') === num);
  return a ? a.name : '';
}
/* Welche abgerufenen Umsätze sind neu? Gleiche Regeln wie beim CSV-Import. */
function fetchedPlan(acct, rows) {
  const existing = DB.tx.filter(t => t.acct === acct), keys = new Set(DB.tx.map(t => t.key)), used = new Set(), occ = {}, out = [];
  for (const r of rows.slice().sort((a, b) => a.date.localeCompare(b.date))) {
    if (r.amount == null || !r.date) continue;
    const base = ['fints', acct, r.date, r.amount, r.ref || `${r.payee}|${r.memo}`].join('|');
    occ[base] = (occ[base] || 0) + 1;
    const x = Object.assign({}, r, { key: base + '#' + occ[base] });
    if (keys.has(x.key)) x.dup = 'known';
    else {
      const hit = existing.find(t => !used.has(t.id) && t.amount === r.amount && Math.abs(daysBetween(t.date, r.date)) <= 3);
      if (hit) { used.add(hit.id); x.dup = hit.gen ? 'gen' : 'similar'; x.hit = hit.id; }
    }
    out.push(x);
  }
  return out;
}
function fintsDone() {
  const e = ED, r = e.sess.result, i = DB.institutes[e.inst];
  if (e.doneSeen) return; e.doneSeen = true;
  for (const acc of r.accounts) e.map[acc.iban || acc.number] = fintsAcctFor(acc);
  if (r.mechanism && i.online.mechanism !== r.mechanism) { i.online.mechanism = r.mechanism; save(); }
}

    <ul>${r.accounts.map(a => { const m = e.map[a.iban || a.number]; return `<li><span class="num">${esc(fmtIban(a.iban) || a.number)}</span> · ${m ? `gehört zu „${esc(m)}“` : '<span class="muted">keinem Konto in der App zugeordnet (IBAN beim Konto eintragen)</span>'}</li>`; }).join('')}</ul>`;
  return `<div class="table-wrap"><table><thead><tr><th>Konto bei der Bank</th><th>Übernehmen in</th><th class="r">Saldo</th><th class="r">Umsätze</th></tr></thead><tbody>

        <td><select data-fimap="${esc(k)}" aria-label="Konto in der App">${opts(target)}</select></td>

    <p class="muted">Bereits vorhandene Buchungen (gleicher Betrag, Datum ±3 Tage) werden übersprungen. Der Saldo wird als „Stand laut Bank“ beim Konto eingetragen.</p>`;

/* Vorschlag „Umsätze ab“: Tag nach der letzten Buchung der zugeordneten Konten minus 7 Tage, sonst 90 Tage zurück */
function fintsSince(instId) {
  const names = new Set(Object.values(DB.accounts).filter(a => a.institute === instId).map(a => a.name));
  const last = DB.tx.filter(t => names.has(t.acct) && t.date <= TODAY && !t.gen).map(t => t.date).sort().pop();
  return last ? addDays(last, -7) : addDays(TODAY, -90);
}
async function fintsSubmit() {

function fintsImport() {

  for (const acc of r.accounts) {

    const a = DB.accounts[target]; let n = 0;
    for (const x of fetchedPlan(target, acc.tx)) {
      if (!x.dup) {
        const nt = { id: ++DB.seq, imp: impId, key: x.key, acct: target, date: x.date, amount: x.amount, payee: x.payee, memo: x.memo, number: '', cleared: '', category: '', cls: '', transfer: null, splits: [], tags: [] };
        DB.tx.push(nt); added.push(nt); n++;
      } else if (x.dup === 'gen') {
        const g = DB.tx.find(t => t.id === x.hit && t.gen);
        if (g) { Object.assign(g, { imp: impId, key: x.key, date: x.date, payee: x.payee || g.payee, memo: x.memo || g.memo }); delete g.gen; upgraded++; n++; }
      }

  }

  const ruled = applyRules(added.filter(n => !n.transfer)).length;
  DB.tx.sort((a, b) => a.date.localeCompare(b.date) || a.id - b.id);
  DB.imports.push({ id: impId, file: 'Online-Abruf ' + i.name, date: new Date().toISOString(), count: added.length });

  save();
  e.imported = `Übernommen. ${lines.join('. ')}.${upgraded + merged ? ` ${upgraded + merged} Umbuchungen abgeglichen.` : ''}${ruled ? ` ${ruled} per Regel zugeordnet.` : ''}`;
  showDialog(); render();
}

/* ---------- Eingangsordner (nur mit Server) ----------
   Heruntergeladene Bankdateien landen in einem Ordner auf dem Server. Solange die App offen ist, prüft sie ihn jede Minute:
   CSV: Import, wenn das Konto sicher erkannt ist (IBAN, Kontonummer in Datei oder Dateiname, Trade Republic mit vorhandenen Konten).
   PDF: Ablage als Kontoauszug, wenn genau ein Konto über IBAN oder Kontonummer im Text erkannt wird.
   Alles andere kommt mit Begründung in die Inbox und wird dort von Hand zugeordnet. */
const Drop = {
  state: null, busy: false, last: null, log: [],
  async api(path, body) {
    const r = await fetch('api/' + path, body === undefined ? { cache: 'no-store' } : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status); return j;
  },
  async bytes(box, name) {
    const r = await fetch(`api/drop/file?box=${box}&name=${encodeURIComponent(name)}`, { cache: 'no-store' });
    if (!r.ok) throw new Error('Datei nicht lesbar (HTTP ' + r.status + ')');
    return new Uint8Array(await r.arrayBuffer());
  },
  inboxCount() { return this.state && this.state.inbox ? this.state.inbox.length : 0; },
  async archive(box, name, acct, source, period) {
    const r = await this.api('drop/archive', { box, name, acct });
    DB.statements = DB.statements || [];
    DB.statements.push({ id: 's' + Date.now() + Math.floor(Math.random() * 1e6), acct, name, size: r.size, type: source === 'csv' ? 'text/csv' : 'application/pdf',
      period: period || periodFromName(name), uploaded: new Date().toISOString(), source, srv: r.path });
    return r;
  },
  /* Konto zu einem PDF: IBAN im Text, sonst Kontonummer im Text oder Dateinamen */
  pdfAccount(info, name) {
    const accts = Object.values(DB.accounts);
    const byIban = [...new Set((info.ibans || []).filter(ibanOk).map(ib => accts.find(a => ibanKey(a.iban) === ib)).filter(Boolean))];
    if (byIban.length === 1) return { acct: byIban[0].name, why: 'IBAN im Auszug' };
    if (byIban.length > 1) return { many: byIban.map(a => a.name) };
    const hay = (info.text || '') + ' ' + name;
    const byNum = accts.filter(a => { const n = String(a.number || '').replace(/\D/g, '').replace(/^0+/, ''); return n.length >= 6 && new RegExp('(^|\\D)0*' + n + '(\\D|$)').test(hay); });
    if (byNum.length === 1) return { acct: byNum[0].name, why: 'Kontonummer im Auszug' };
    return byNum.length > 1 ? { many: byNum.map(a => a.name) } : null;
  },
  async processOne(f) {

/* ---------- Kontoauszüge ablegen ----------
   Dateien liegen in IndexedDB (größerer Speicher als localStorage), die Liste in DB.statements.
   Das JSON-Backup enthält die Dateien selbst nicht. */
const Files = {
  _db: null,
  open() {
    return this._db || (this._db = new Promise((res, rej) => {
      const r = indexedDB.open('finanzmanager-dateien', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('files');
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    }));
  },
  async run(mode, fn) { const db = await this.open(); return new Promise((res, rej) => { const tx = db.transaction('files', mode), st = tx.objectStore('files'); const q = fn(st); tx.oncomplete = () => res(q && q.result); tx.onerror = () => rej(tx.error); }); },
  put(id, blob) { return this.run('readwrite', st => st.put(blob, id)); },
  get(id) { return this.run('readonly', st => st.get(id)); },
  del(id) { return this.run('readwrite', st => st.delete(id)); }
};
/* ---------- Belege zu Buchungen ----------

const RCPT_MAX = 50 * 1024 * 1024;

async function attachReceipt(txId, file) {

  try {
    if (Server.ok) {
      const r = await fetch(`api/archive/upload?kind=beleg&acct=${encodeURIComponent(t.acct)}&year=${t.date.slice(0, 4)}&name=${encodeURIComponent(file.name)}`, { method: 'PUT', body: file });
      const j = await r.json(); if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status); srv = j.path;

/* ---------- Beleg beim Hochladen einer Buchung zuordnen ----------
   Vorauswahl aus dem Dateinamen: Datum, Betrag und Wörter, die im Empfänger oder Memo vorkommen. */
const RCPT_STOP = new Set(['rechnung', 'beleg', 'quittung', 'kontoauszug', 'auszug', 'scan', 'dokument', 'document', 'invoice', 'ihrer', 'ihre', 'ihren', 'jährliche', 'jaehrliche', 'informationen', 'information', 'zur', 'zum', 'und', 'der', 'die', 'das', 'vom', 'für', 'fuer']);
function guessFromName(name) {
  const base = name.replace(/\.[^.]+$/, '');
  let date = '', m;
  if ((m = base.match(/(20\d\d)[-_.]?(0[1-9]|1[0-2])[-_.]?(0[1-9]|[12]\d|3[01])(?!\d)/))) date = `${m[1]}-${m[2]}-${m[3]}`;
  else if ((m = base.match(/(?<!\d)(0?[1-9]|[12]\d|3[01])\.(0?[1-9]|1[0-2])\.(20\d\d)/))) date = `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
  let amount = null;
  if ((m = base.match(/(?<![\d.,])(\d{1,3}(?:\.\d{3})+|\d+),(\d{2})(?!\d)/)) || (m = base.match(/(?<![\d.,])(\d+)\.(\d{2})\s?(?:€|eur)/i))) amount = Math.round(parseFloat(m[1].replace(/\./g, '') + '.' + m[2]) * 100);
  const words = [...new Set(base.toLowerCase().replace(/\d+([.,]\d+)*/g, ' ').split(/[^a-zäöüß]+/).filter(w => w.length >= 4 && !RCPT_STOP.has(w)))];
  return { date, amount, words };
}
function receiptCandidates(st) {
  const g = st.guess, date = st.date, q = (st.q || '').trim().toLowerCase();
  // Stichworte nach Seltenheit gewichten: „stuttgarter“ zählt mehr als „versicherung“, das in vielen Buchungen steht
  const text = t => `${t.payee || ''} ${t.payeeOrig || ''} ${t.memo || ''}`.toLowerCase();
  const N = Math.max(2, DB.tx.length), wt = {};
  for (const w of g.words) { const df = DB.tx.reduce((n, t) => n + (text(t).includes(w) ? 1 : 0), 0); wt[w] = df ? 50 * Math.log(N / df) / Math.log(N) : 0; }
  const score = t => {
    let s = 0;
    if (g.amount != null && Math.abs(t.amount) === g.amount) s += 100;
    const hay = text(t);
    s += g.words.filter(w => hay.includes(w)).reduce((x, w) => x + wt[w], 0);
    if (date) s -= Math.min(60, Math.abs(daysBetween(t.date, date)));
    return s;
  };
  const pick = win => DB.tx.filter(t => !t.gen && (!st.acct || t.acct === st.acct) && (!date || Math.abs(daysBetween(t.date, date)) <= win)
    && (!q || `${displayPayee(t)} ${t.memo || ''} ${t.category || ''} ${(Math.abs(t.amount) / 100).toFixed(2).replace('.', ',')}`.toLowerCase().includes(q)));
  let list = pick(14); if (!list.length && date) list = pick(60);
  return list.map(t => ({ t, s: score(t) })).sort((a, b) => b.s - a.s || b.t.date.localeCompare(a.t.date)).slice(0, 15);
}

function periodFromName(n) {

function monthChart(inc, out, sav) {
  const W = 720, H = 220, L = 70, B = 24, T = 10;
  sav = sav || Array(12).fill(0);
  const max = Math.max(1, ...inc, ...out, ...sav);
  const step = niceStep(max / 4), top = Math.ceil(max / step) * step;
  const y = v => T + (H - T - B) * (1 - v / top);
  const cw = (W - L) / 12, bw = Math.min(14, cw / 4);
  let g = '';
  for (let v = 0; v <= top + 1; v += step) g += `<line class="grid" x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${EUR.format(v / 100).replace(/,00\s?€/, ' €')}</text>`;
  let bars = '';
  for (let m = 0; m < 12; m++) {
    const x = L + m * cw + cw / 2;
    const sv = Math.max(0, sav[m]);
    bars += `<rect class="in" x="${x - 1.5 * bw - 2}" y="${y(inc[m])}" width="${bw}" height="${y(0) - y(inc[m])}" rx="2"><title>${MONTHS[m]} Einnahmen ${money(inc[m])}</title></rect>`;
    bars += `<rect class="out" x="${x - bw / 2}" y="${y(out[m])}" width="${bw}" height="${y(0) - y(out[m])}" rx="2"><title>${MONTHS[m]} Ausgaben ${money(out[m])}</title></rect>`;
    bars += `<rect class="save" x="${x + bw / 2 + 2}" y="${y(sv)}" width="${bw}" height="${y(0) - y(sv)}" rx="2"><title>${MONTHS[m]} gespart und getilgt ${money(sav[m])}</title></rect>`;
    bars += `<text x="${x}" y="${H - 6}" text-anchor="middle">${MONTHS[m]}</text>`;
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" style="min-width:520px" role="img" aria-label="Einnahmen und Ausgaben pro Monat">${g}${bars}</svg>`;
}
/* Zwei Ringe: alle Ausgaben (mit „Ohne Kategorie“) und nur die zugeordneten.
   Jede Kategorie behält in beiden Ringen ihre Farbe; Plätze 1–7 nach Betrag, der Rest wird „Sonstige“. */
function catDonuts(byCat) {
  const NONE = 'Ohne Kategorie';
  const ranked = Object.entries(byCat).filter(([c, v]) => c !== NONE && v > 0).sort((a, b) => b[1] - a[1]);
  if (!ranked.length && !byCat[NONE]) return '<p class="muted">Keine Ausgaben in diesem Jahr.</p>';
  const color = {}; ranked.slice(0, 7).forEach(([c], i) => color[c] = `var(--c${i + 1})`);
  const slices = withNone => {
    const s = ranked.slice(0, 7).map(([c, v]) => ({ name: c, cat: c, v, fill: color[c] }));
    const rest = ranked.slice(7).reduce((a, [, v]) => a + v, 0);
    if (rest) s.push({ name: `Sonstige (${ranked.length - 7})`, v: rest, fill: 'var(--c-other)' });
    if (withNone && byCat[NONE] > 0) s.push({ name: NONE, cat: '__none', v: byCat[NONE], fill: 'url(#hatch-none)', none: true });
    return s;
  };
  return `<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><pattern id="hatch-none" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="var(--c-none-bg)"/><line x1="0" y1="0" x2="0" y2="6" stroke="var(--muted)" stroke-width="2.5"/></pattern></defs></svg>
    <div class="donuts">${donut('Alle Ausgaben', 'gesamt', slices(true))}${donut('Ohne nicht zugeordnete', 'zugeordnet', slices(false))}</div>`;
}
function donut(title, centerLabel, s) {
  const total = s.reduce((a, x) => a + x.v, 0);
  const R = 90, r = 58, C = 100;
  const pt = (rad, a) => `${(C + rad * Math.sin(a)).toFixed(2)} ${(C - rad * Math.cos(a)).toFixed(2)}`;
  let a0 = 0, paths = '';
  for (const x of s) {
    const frac = total ? x.v / total : 0, a1 = a0 + frac * 2 * Math.PI;
    const pct = (frac * 100).toLocaleString('de-DE', { maximumFractionDigits: 1 });
    const tip = `<title>${esc(x.name)}: ${money(x.v)} (${pct} %)</title>`;
    if (frac >= 0.9999) paths += `<path d="M ${pt(R, 0)} A ${R} ${R} 0 1 1 ${pt(R, Math.PI)} A ${R} ${R} 0 1 1 ${pt(R, 0)} M ${pt(r, 0)} A ${r} ${r} 0 1 0 ${pt(r, Math.PI)} A ${r} ${r} 0 1 0 ${pt(r, 0)} Z" fill-rule="evenodd" fill="${x.fill}">${tip}</path>`;
    else if (frac > 0) { const big = a1 - a0 > Math.PI ? 1 : 0;
      paths += `<path d="M ${pt(R, a0)} A ${R} ${R} 0 ${big} 1 ${pt(R, a1)} L ${pt(r, a1)} A ${r} ${r} 0 ${big} 0 ${pt(r, a0)} Z" fill="${x.fill}">${tip}</path>`; }
    a0 = a1;
  }
  const legend = s.map(x => `<li${x.none ? ' class="none"' : ''}><i style="background:${x.none ? 'var(--c-none-bg)' : x.fill}"></i><span class="name">${x.cat ? `<a href="#buchungen" data-catjump="${esc(x.cat)}" data-catyear="${esc(UI.year)}" title="Buchungen ${esc(x.name)} ${esc(UI.year)}">${esc(x.name)}</a>` : esc(x.name)}</span>
    <span class="num">${money(x.v)}</span><span class="num muted">${total ? Math.round(x.v / total * 100) : 0} %</span></li>`).join('');
  return `<figure class="donut"><figcaption>${esc(title)}</figcaption>
    <div class="donut-body"><svg viewBox="0 0 200 200" role="img" aria-label="${esc(title)}, ${money(total)}">${paths}
      <text x="100" y="98" text-anchor="middle" class="big">${EUR.format(Math.round(total / 100)).replace(/,00\s?€/, ' €')}</text>
      <text x="100" y="118" text-anchor="middle">${centerLabel}</text></svg>
    <ul class="donut-legend">${legend}</ul></div></figure>`;
}
function niceStep(v) { const p = Math.pow(10, Math.floor(Math.log10(Math.max(v, 1)))); for (const k of [1, 2, 2.5, 5, 10]) if (k * p >= v) return k * p; return 10 * p; }

/* Tag bei allen ausgewählten Buchungen setzen oder entfernen; verknüpfte Gegenbuchungen ziehen mit */
function bulkTag(tag, add) {
  const ids = new Set(UI.sel);
  for (const t of DB.tx) if (ids.has(t.id) && t.link) ids.add(t.link);
  const snap = DB.tx.filter(t => ids.has(t.id)).map(t => [t, (t.tags || []).slice()]);
  let n = 0;
  for (const [t] of snap) {
    const has = (t.tags || []).includes(tag);
    if (add && !has) { t.tags = [...(t.tags || []), tag]; if (UI.sel.has(t.id)) n++; }
    if (!add && has) { t.tags = t.tags.filter(g => g !== tag); if (UI.sel.has(t.id)) n++; }
  }
  if (add && !DB.tags.includes(tag)) { DB.tags.push(tag); DB.tags.sort((a, b) => a.localeCompare(b, 'de')); }
  save(); render();
  toast(add ? `Tag „${tag}“ bei ${n} ${n === 1 ? 'Buchung' : 'Buchungen'} vergeben.` : `Tag „${tag}“ bei ${n} ${n === 1 ? 'Buchung' : 'Buchungen'} entfernt.`,
    { label: 'Rückgängig', run: () => { for (const [t, tags] of snap) t.tags = tags; save(); render(); toast('Rückgängig gemacht.'); } }, 10000);
}

/* ---------- Geldfluss ----------
   Woher das Geld kommt, über welche Konten es läuft und wohin es geht, als Sankey-Diagramm:
   links Einnahmen nach Kategorie, in der Mitte die Konten in Reihenfolge der Umbuchungen, rechts die Ausgaben.
   Was auf einem Konto bleibt, fließt nach „Auf den Konten geblieben“; wurde mehr ausgegeben als hereinkam,
   kommt der Rest „Aus dem Kontostand“. Umbuchungen zählen netto je Kontopaar. */
const FLOW_TOP_IN = 5, FLOW_TOP_OUT = 8;
const FLOW_KINDS = { in: 'Einnahme', x: 'Umbuchung', out: 'Ausgabe', save: 'Sparen', tilg: 'Tilgung', keep: 'Geblieben', res: 'Aus dem Bestand' };
function flowData(period) {
  const act = new Set(Object.values(DB.accounts).filter(a => !a.inactive && !loanOfAcct(a.name)).map(a => a.name));
  const cat = {}, xfer = {}, ext = {}, ctx = wealthCtx();
  let savNet = 0, tilNet = 0;
  const addX = (a, b, v) => { const k = a + '\u0000' + b; xfer[k] = (xfer[k] || 0) + v; };
  const addC = (a, c, v) => { const m = cat[a] || (cat[a] = {}); m[c] = (m[c] || 0) + v; };
  const addE = (f, t, v, kind) => { const k = f + '\u0000' + t; (ext[k] = ext[k] || { v: 0, kind }).v += v; };
  for (const t of DB.tx) {
    if (!t.date.startsWith(period) || t.date > TODAY || !act.has(t.acct)) continue;
    for (const q of txParts(t, ctx)) {
      if (q.kind === 'save') savNet -= q.amount; else if (q.kind === 'tilg') tilNet -= q.amount;
      if (q.kind === 'x' || (q.kind === 'save' && act.has(q.to))) {
        if (q.amount < 0) addX(t.acct, q.to, -q.amount);           // jede Umbuchung nur von der abgebenden Seite zählen
        else if (!act.has(q.to)) addX(q.to, t.acct, q.amount);
        continue;
      }
      if (q.kind === 'save' || q.kind === 'tilg') {                 // Sparen ohne aktives Zielkonto, Tilgung von Krediten
        const node = q.kind + ':' + q.to;
        if (q.amount < 0) addE(t.acct, node, -q.amount, q.kind); else addE('from:' + node, t.acct, q.amount, 'x');
        continue;
      }
      addC(t.acct, (q.cat || 'Ohne Kategorie').split(':')[0].trim() || 'Ohne Kategorie', q.amount);
    }
  }
  // Umbuchungen netto je Kontopaar
  const links = [], seen = new Set();
  for (const k of Object.keys(xfer)) {
    const [a, b] = k.split('\u0000'), pk = [a, b].sort().join('\u0000'); if (seen.has(pk)) continue; seen.add(pk);
    const net = (xfer[a + '\u0000' + b] || 0) - (xfer[b + '\u0000' + a] || 0);
    const kind = (f, t) => isSpendAcct(f) && isSaveAcct(t) ? 'save' : 'x';
    if (net > 0) links.push({ from: a, to: b, v: net, kind: kind(a, b) }); else if (net < 0) links.push({ from: b, to: a, v: -net, kind: kind(b, a) });
  }
  for (const [k, e] of Object.entries(ext)) { const [f, t] = k.split('\u0000'); links.push({ from: f, to: t, v: e.v, kind: e.kind }); }
  // Kategorien: netto je Konto und Kategorie; die größten einzeln, der Rest gesammelt
  const inTot = {}, outTot = {};
  for (const [a, m] of Object.entries(cat)) for (const [c, v] of Object.entries(m)) { if (v > 0) inTot[c] = (inTot[c] || 0) + v; else if (v < 0) outTot[c] = (outTot[c] || 0) - v; }
  const top = (tot, n) => new Set(Object.entries(tot).sort((x, y) => y[1] - x[1]).slice(0, Object.keys(tot).length > n + 1 ? n : n + 1).map(([c]) => c));
  const tin = top(inTot, FLOW_TOP_IN), tout = top(outTot, FLOW_TOP_OUT);
  const agg = {};
  for (const [a, m] of Object.entries(cat)) for (const [c, v] of Object.entries(m)) {
    if (v > 0) { const n = 'in:' + (tin.has(c) ? c : 'Sonstige Einnahmen'); agg[n + '\u0000' + a] = (agg[n + '\u0000' + a] || 0) + v; }
    else if (v < 0) { const n = 'out:' + (tout.has(c) ? c : 'Sonstige Ausgaben'); agg[a + '\u0000' + n] = (agg[a + '\u0000' + n] || 0) - v; }
  }
  for (const [k, v] of Object.entries(agg)) { const [f, t] = k.split('\u0000'); links.push({ from: f, to: t, v, kind: f.startsWith('in:') ? 'in' : 'out' }); }
  // Ausgleich je Konto: was blieb oder aus dem Bestand kam
  const accts = new Set(); for (const l of links) for (const n of [l.from, l.to]) if (act.has(n)) accts.add(n);
  for (const a of accts) {
    const inn = links.filter(l => l.to === a).reduce((x, l) => x + l.v, 0), out = links.filter(l => l.from === a).reduce((x, l) => x + l.v, 0);
    if (inn > out) links.push(isSaveAcct(a) ? { from: a, to: 'keepsave', v: inn - out, kind: 'save' } : { from: a, to: 'keep', v: inn - out, kind: 'keep' });
    else if (out > inn) links.push({ from: 'res', to: a, v: out - inn, kind: 'res' });
  }
  return { links: links.filter(l => l.v > 0), accts, act, inTot, outTot, savNet, tilNet };
}
/* Verfügbare Breite im Panel: Hauptbereich ohne seinen Innenabstand und ohne den des Panels */
function flowWidth() {
  const m = $('#main'); if (!m) return 1100;
  const cs = getComputedStyle(m); return Math.floor(m.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight) - 2 * 19);
}
const flowLabel = n => n === 'keep' ? 'Auf den Konten geblieben' : n === 'keepsave' ? 'Auf Spar- und Depotkonten' : n === 'res' ? 'Aus dem Kontostand'
  : n === 'save:' + SAVE_CAT ? 'Sparen (Kategorie)' : n.startsWith('save:') ? 'Sparen: ' + n.slice(5) : n.startsWith('tilg:') ? 'Tilgung ' + n.slice(5)
  : n.startsWith('from:save:') ? 'Entnahme ' + n.slice(10).replace(SAVE_CAT, 'Ersparnisse') : n.startsWith('from:tilg:') ? 'Kredit ' + n.slice(10) : n.replace(/^(in|out):/, '');
function sankeySVG(fd) {
  const { links, act } = fd; if (!links.length) return '';
  const isAcct = n => act.has(n);
  // Spalten: Quellen 0, Konten nach längstem Umbuchungsweg, Ziele zuletzt
  const preds = {}; for (const l of links) if (isAcct(l.from) && isAcct(l.to)) (preds[l.to] = preds[l.to] || []).push(l.from);
  const rank = {}, visit = (n, stack) => {
    if (rank[n] != null) return rank[n]; if (stack.has(n)) return 0;
    stack.add(n); let r = 1; for (const p of preds[n] || []) r = Math.max(r, visit(p, stack) + 1); stack.delete(n); return rank[n] = r;
  };
  const names = [...new Set(links.flatMap(l => [l.from, l.to]))];
  for (const n of names) if (isAcct(n)) visit(n, new Set());
  const maxR = Math.max(1, ...Object.values(rank)), last = maxR + 1;
  const col = n => isAcct(n) ? rank[n] : (links.some(l => l.from === n) ? 0 : last);
  const nodes = {}; for (const n of names) nodes[n] = { n, c: col(n), inV: 0, outV: 0 };
  for (const l of links) { nodes[l.from].outV += l.v; nodes[l.to].inV += l.v; }
  for (const x of Object.values(nodes)) x.v = Math.max(x.inV, x.outV);
  // Senkrechte Anordnung: Ausgleichsknoten zuletzt, sonst nach Größe
  const cols = []; for (const x of Object.values(nodes)) (cols[x.c] = cols[x.c] || []).push(x);
  // Breite wie der Platz auf dem Bildschirm, damit die Schrift nicht mitschrumpft
  // mindestens 150 px je Spalte, damit die Kontonamen nicht in die nächste Spalte ragen
  const PAD = 16, TOP = 10, MAXH = 560, L = 170, Rm = 210, NW = 14, W = Math.max(L + Rm + 145 * last, flowWidth());
  const sumMax = Math.max(...cols.filter(Boolean).map(c => c.reduce((x, n) => x + n.v, 0)));
  const nMax = Math.max(...cols.filter(Boolean).map(c => c.length));
  const k = (MAXH - PAD * (nMax - 1)) / sumMax;
  let H = 0;
  cols.forEach((c, i) => {
    if (!c) return;
    const end = n => n === 'keep' || n === 'keepsave' || n === 'res';
    c.sort((a, b) => (end(a.n) - end(b.n)) || b.v - a.v);
    let y = TOP; for (const n of c) { n.h = Math.max(2, n.v * k); n.y = y; y += n.h + PAD; n.x = L + (W - L - Rm - NW) * i / last; }
    H = Math.max(H, y - PAD + TOP);
  });
  // Bänder: Reihenfolge an den Knoten nach Lage der Gegenseite, damit sich wenig kreuzt
  for (const x of Object.values(nodes)) { x.oy = x.y; x.iy = x.y; }
  const ls = links.map(l => Object.assign({}, l, { s: nodes[l.from], t: nodes[l.to], w: Math.max(1, l.v * k) }));
  ls.slice().sort((a, b) => a.t.y - b.t.y).forEach(l => { l.y0 = l.s.oy + l.w / 2; l.s.oy += l.w; });
  ls.slice().sort((a, b) => a.s.y - b.s.y).forEach(l => { l.y1 = l.t.iy + l.w / 2; l.t.iy += l.w; });
  const kindTxt = FLOW_KINDS;
  const paths = ls.sort((a, b) => b.w - a.w).map(l => {
    const x0 = l.s.x + NW, x1 = l.t.x, mx = (x0 + x1) / 2;

/* ---------- Kredite: Diagramm, Tilgungsplan, Rechner ---------- */
function balanceChart(l, base, sim) {
  const W = 720, H = 220, L = 74, R = 12, T = 12, B = 26;
  const pts = s => [{ date: s.anchorDate, balance: s.anchorBal }].concat(s.rows.map(x => ({ date: x.date, balance: x.balance })));
  const a = pts(base), b = sim ? pts(sim) : null;
  const t0 = new Date(a[0].date).getTime();
  const t1 = Math.max(new Date(a[a.length - 1].date).getTime(), t0 + 864e5 * 365);
  const max = Math.max(1, a[0].balance, ...(b ? [b[0].balance] : []));
  const step = niceStep(max / 4), top = Math.ceil(max / step) * step;
  const x = d => L + (W - L - R) * (new Date(d).getTime() - t0) / (t1 - t0);
  const y = v => T + (H - T - B) * (1 - v / top);
  const path = p => p.map((q, i) => `${i ? 'L' : 'M'}${x(q.date).toFixed(1)},${y(q.balance).toFixed(1)}`).join(' ');
  let g = '';
  for (let v = 0; v <= top + 1; v += step) g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${EUR.format(v / 100).replace(/,00\s?€/, ' €')}</text>`;
  const y0 = new Date(a[0].date).getFullYear(), y1 = new Date(t1).getFullYear(), ys = Math.max(1, Math.ceil((y1 - y0) / 8));
  for (let yr = y0 + 1; yr <= y1; yr += ys) g += `<text x="${x(yr + '-01-01')}" y="${H - 6}" text-anchor="middle">${yr}</text>`;
  const marks = [];
  if (TODAY > a[0].date && new Date(TODAY).getTime() < t1) marks.push(`<line class="today" x1="${x(TODAY)}" x2="${x(TODAY)}" y1="${T}" y2="${H - B}"/><text x="${x(TODAY) + 4}" y="${T + 10}">heute</text>`);
  if (l.fixedUntil && l.fixedUntil > a[0].date && new Date(l.fixedUntil).getTime() < t1) marks.push(`<line class="fixed" x1="${x(l.fixedUntil)}" x2="${x(l.fixedUntil)}" y1="${T}" y2="${H - B}"/><text x="${x(l.fixedUntil) + 4}" y="${T + 24}">Zinsbindung</text>`);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" style="min-width:520px" role="img" aria-label="Verlauf der Restschuld">${g}${marks.join('')}
    <path class="line-base ${b ? 'dim' : ''}" d="${path(a)}"/>${b ? `<path class="line-sim" d="${path(b)}"/>` : ''}</svg>`;
}
function yearPlan(s) {
  const y = {};
  for (const r of s.rows) {
    const k = r.date.slice(0, 4), e = y[k] = y[k] || { interest: 0, principal: 0, extra: 0, balance: 0 };
    e.interest += r.interest; if (r.extra) e.extra += r.principal; else e.principal += r.principal; e.balance = r.balance;
  }
  return `<div class="table-wrap"><table><thead><tr><th>Jahr</th><th class="r">Zinsen</th><th class="r">Tilgung</th><th class="r">Sondertilgung</th><th class="r">Restschuld Ende</th></tr></thead><tbody>
    ${Object.entries(y).map(([k, e]) => `<tr class="${k < TODAY.slice(0, 4) ? 'past' : ''}"><td class="num">${k}</td><td class="r num">${money(e.interest)}</td><td class="r num">${money(e.principal)}</td><td class="r num">${e.extra ? money(e.extra) : '–'}</td><td class="r num">${money(e.balance)}</td></tr>`).join('')}
  </tbody></table></div>`;
}

      <label class="field"><span>Oder Rate erhöhen auf €</span><input type="text" inputmode="decimal" id="sim-rate-${id}" data-sim="${esc(l.id)}" data-simf="newRate" value="${sm.newRate ? amtDE(sm.newRate) : ''}" placeholder="${amtDE(l.payment)}"></label>
    </div>
    ${yearlyLimit ? `<p class="muted">Erlaubt: ${l.extraPct} % pro Jahr, also bis ${money(yearlyLimit)}.</p>` : ''}
    ${result || '<p class="muted">Trage einen Betrag ein, dann siehst du Ersparnis und neues Ende.</p>'}
    ${active ? `<div class="row"><button data-simsave="${esc(l.id)}" ${sm.once > 0 ? '' : 'disabled title="Nur einmalige Sondertilgungen lassen sich eintragen"'}>Einmalige Sondertilgung als geleistet eintragen</button><button data-simclear="${esc(l.id)}">Zurücksetzen</button></div>` : ''}

function deadlineChip(c, i) {
